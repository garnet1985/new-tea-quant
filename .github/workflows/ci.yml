name: Build & Test

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # CI 已在 setup-python 解释器安装 requirements-dev；勿再切到空 venv/
      NTQ_SKIP_AUTO_VENV: "1"
      NTQ_TRACE_ENABLED: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bootstrap DuckDB demo data for integration tests
        run: |
          python setup/core/steps/init_userspace/install.py
          mkdir -p userspace/system/config/database
          printf '%s\n' '{"database_type": "duckdb"}' > userspace/system/config/database/common.json
          python setup/core/steps/import_data/install.py --force

      - name: Smoke test - import core modules
        run: |
          python - << 'EOF'
          import importlib
          modules = [
              "core.infra.project_context.path_manager",
              "core.infra.cli",
              "core.infra.utils",
              "core.infra.trace",
              "core.modules.strategy",
              "core.modules.data_manager",
              "core.modules.data_source",
              "core.modules.tag",
              "core.modules.indicator",
          ]
          for m in modules:
              importlib.import_module(m)
          print("All core modules imported successfully.")
          EOF

      - name: Run core tests
        run: |
          python -m pytest -v -rs

  # UI 仅装 BFF 依赖时，launcher / BFF 冷启动链不得 import 未声明的三方包
  minimal-ui-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: UI minimal import smoke
        run: python -m core.infra.cli.dev.scripts.minimal_import_check

  # 确保 Dockerfile 可构建（不跑完整 install，避免 CI 时间过长）
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build image
        run: docker build -t new-tea-quant:ci .

  # 模拟用户下载分支 zip → Python 3.9 冷启动 → 安装 → 策略枚举
  smoke-fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Pack branch as zip and run fresh-install smoke
        run: |
          set -euo pipefail
          git archive --format=zip -o /tmp/ntq-source.zip HEAD
          rm -rf /tmp/ntq-smoke
          mkdir -p /tmp/ntq-smoke
          unzip -q /tmp/ntq-source.zip -d /tmp/ntq-smoke
          cd /tmp/ntq-smoke
          python devtools/quick_tools/smoke_fresh_install.py --repo-root .

