name: bff
version: "0.2.1"
compatible_core_versions: ">=0.5.0"
description: "FED 的 Flask BFF：HTTP 编排与 DTO；领域执行在 core.modules / core.infra。"
dependencies:
  - modules.strategy
  - modules.tag
  - modules.data_manager
  - modules.data_source
  - modules.data_contract
  - modules.indicator
  - modules.market_profile
  - infra.project_context
  - infra.task_guard
  - infra.discovery
  - infra.trace
  - infra.db
  - ui
changelog:
  - version: "0.2.1"
    changes:
      - 决策者 D1：`/v1/strategy/{key}/decision/sessions` 列表 / 打开 / pick / done / reset / next / holdings / info
      - 决策者现场增加 `allocation_mode` / `suggested_basis`；建议股数按等价 / 等股 / 凯莉
      - 决策者 holdings 增加 `hold_unit`（与到期同一口径）
      - 决策者 pick 仍支持 `cash`；现场增加 `suggested_cash` / `lot_step`
      - 决策者现场增加 `calendar`：截止当天的发现机会与买入 / 卖出流水
  - version: "0.2.0"
    changes:
      - 从 core/ui 独立为顶层模块；取消 modules 内 launcher，BFF 专有逻辑收口到本目录
      - 按 platform / data / strategy / tag 分域注册 Flask blueprint
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能