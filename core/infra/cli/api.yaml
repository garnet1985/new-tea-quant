module: infra.cli
version: 0.4.0
requires: core>=0.4.1

# ---------------------------------------------------------------------------
# 用语
#
#   Cli        — Facade，对外唯一入口
#   namespace  — user / dev / shared
#
# ---------------------------------------------------------------------------

---

Cli:
  layer: facade
  description: "CLI facade — user / dev / shared namespace API"

  namespaces:
    user:
      description: "终端用户 CLI（cli.py）"

      apis:
        bootstrap:
          description: "venv 重入与 install 门闸"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: entry_file
                type: str
                required: true
          returns: null
          example: |
            from core.infra.cli import Cli
            Cli.user.bootstrap(__file__)

        main:
          description: "解析 argv 并执行用户命令"
          stability: stable
          binding: static
          parameters:
            keyword_only:
              - name: argv
                type: Optional[List[str]]
                required: false
                default: null
                notes: "默认 sys.argv[1:]"
          returns: int
          example: |
            from core.infra.cli import Cli
            raise SystemExit(Cli.user.main())

    dev:
      description: "开发 / 运维 CLI（devcli.py）"

      apis:
        main:
          description: "解析 argv 并执行开发命令"
          stability: stable
          binding: static
          parameters:
            keyword_only:
              - name: argv
                type: Optional[List[str]]
                required: false
                default: null
          returns: int
          example: |
            from core.infra.cli import Cli
            raise SystemExit(Cli.dev.main())

    shared:
      description: "双入口共用的 argv 脚手架"

      apis:
        expand_argv:
          description: "短命令别名展开为长命令名"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: argv
                type: Sequence[str]
                required: true
            keyword_only:
              - name: short_to_long
                type: Mapping[str, str]
                required: true
              - name: long_commands
                type: frozenset[str]
                required: true
              - name: default_command
                type: str
                required: false
                default: "'version'"
              - name: version_argv
                type: Optional[frozenset[str]]
                required: false
                default: null
              - name: after_expand
                type: Optional[Callable]
                required: false
                default: null
          returns: List[str]
          example: |
            from core.infra.cli import Cli
            Cli.shared.expand_argv(
                ["sp", "-f"],
                short_to_long={"sp": "strategy_price_factor"},
                long_commands=frozenset({"strategy_price_factor"}),
            )

        is_help_argv:
          description: "是否为 -h / --help / help"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: argv
                type: Sequence[str]
                required: true
          returns: bool

        aliases_for:
          description: "给定长命令名，返回短别名列表"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: short_to_long
                type: Mapping[str, str]
                required: true
              - name: long_name
                type: str
                required: true
          returns: List[str]
