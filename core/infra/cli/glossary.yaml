# NTQ Glossary - infra.cli
# Version: 0.4.0
#
# 目的：统一 CLI 模块术语，避免 user/dev 混称。

---

terms:
  Cli:
    recommended: "Cli"
    meaning: "Facade；对外唯一入口"
    forbidden: ["CliApp as public API", "main 自由函数导出"]

  user_cli:
    recommended: "user CLI / Cli.user"
    meaning: "面向策略用户的入口（cli.py）"
    forbidden: ["app cli", "prod cli"]

  dev_cli:
    recommended: "dev CLI / Cli.dev"
    meaning: "面向开发与运维的入口（devcli.py）"
    forbidden: ["devtools cli 作为包名"]

  shared:
    recommended: "Cli.shared / SharedNamespace"
    meaning: "双入口共用的 argv 展开与 help 判定"
    forbidden: ["utils", "helpers 作为公开导出"]

  abbrev:
    recommended: "short alias / abbrev"
    meaning: "无横杠短命令（如 sp → strategy_price_factor）"
    notes: "user 与 dev 各有独立 SHORT_TO_LONG，允许同名短别名语义不同"

  command_registry:
    recommended: "command registry"
    meaning: "LONG_COMMANDS + SHORT_TO_LONG + DEFAULT_COMMAND"
    forbidden: ["把两套 registry 合并成一张表"]

  bootstrap:
    recommended: "bootstrap"
    meaning: "venv 重入与 install 门闸（仅 user）"
