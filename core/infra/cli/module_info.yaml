# 模块元数据
name: infra.cli
version: "0.4.2"
compatible_core_versions: ">=0.4.1"
description: "New Tea Quant（NTQ）双入口命令行门面（Cli.user / Cli.dev / Cli.shared）；入口脚本 cli.py 与 devcli.py。"
dependencies:
  - infra.project_context
  - infra.system_actions
changelog:
  - version: "0.4.2"
    changes:
      - 公开 API 状态按 core 0.x 规则改为最高 beta（禁止 stable）
  - version: "0.4.1"
    changes:
      - 文档对齐 module-doc-standard：根目录 API.md；DECISIONS 并入 DESIGN；TEST_CASES.md 取代 test_cases.yaml；移除 api.yaml
  - version: "0.4.0"
    changes:
      - 标准模块化：Facade Cli + namespace；仅 export 类
      - 补齐 api.yaml / glossary.yaml / docs；无自由函数公开导出
  - version: "0.3.0"
    changes:
      - 合并 infra.devcli：cli/{shared,user,dev}；入口仍为 cli.py / devcli.py
      - 删除独立 infra.devcli 包（无兼容层）
  - version: "0.2.1"
    changes:
      - 新增 tag 的 dry-run 模式：运行计算但不写入数据库
  - version: "0.2.0"
    changes:
      - 重写 CLI：策略/标签/数据扫描/更新/模拟/分析/管理
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
