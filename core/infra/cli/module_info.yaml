# 模块元数据
name: infra.cli
version: "0.4.0"
compatible_core_versions: ">=0.4.1"
description: "客户端模块：在命令行工具内为用户或开发者提供一系列边界操作命令的模块。"
dependencies:
  - infra.project_context
  - infra.task_guard
  - infra.db
  - infra.trace
  - modules.strategy
  - modules.tag
  - modules.data_manager
  - modules.data_source
changelog:
  - version: "0.4.0"
    changes:
      - 移除 strategy_analyse / sy；分析不再走策略模块
  - version: "0.3.0"
    changes:
      - 对cli模块进行标准化处理，补齐文档，标准化对外API
      - 文档微调，移除无用内容
      - 公开 API 状态按 core 0.x 规则改为最高 beta（禁止 stable）
      - 暴露更多API防止外部模块直接调用包内非公开接口
  - version: "0.2.2"
    changes:
      - 在代码模块级别合并devcli和cli进入一个模块cli，删除独立 infra.devcli
  - version: "0.2.1"
    changes:
      - 对 tag 命令增加 --dry-run 参数：运行计算但不写入数据库
  - version: "0.2.0"
    changes:
      - 分出devcli和cli分别给开发者与用户使用
      - 为 标签/数据扫描/更新/模拟/分析/管理 重新编排名称和参数
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
