# 命令行布局 术语表
# Version: 0.3.0
# Compatible-Core: >=0.5.0
#
# 目的：解释本模块代码 / API 中出现的英文概念（是什么、为何存在、代码对应、相关对比）。
# aliases / avoid 只做命名纪律，不能代替解释。
# 本模块只做终端 ASCII/图标排版；不做 GUI 图表。

terms:
  CmdLayout:
    definition: |
      终端排版 Facade：把标题、对照表、水平条形图、行内文本、跨平台图标收成统一入口。
      调用方挂 CmdLayout.bar_chart / title / table / text / icon；不要跨模块直接
      import 内部 Title / BarChart / IconService。包根短入口 i 仅用于图标。
    in_code: "from core.infra.cmd_layout import CmdLayout, i"
    aliases:
      - "命令行布局门面"
    avoid:
      - "CmdLayout.present"
      - "CmdLayout.separator（已删除）"
      - "deep-import Title / BarChart / IconService"

  bar_chart:
    definition: |
      水平 ASCII 分布 / 直方图命名空间。已分桶数据用 render；连续样本用 from_values（先等宽
      分桶再画）。填充固定纯 ASCII（# / 空格），避免 Windows 终端乱码。不是 GUI 图表库。
    in_code: "CmdLayout.bar_chart.render / from_values / print / print_from_values"
    aliases:
      - "条形图"
      - "分布图"
    avoid: []

  histogram:
    definition: |
      本模块语境下特指 from_values：对连续数值等宽切成若干 bin，再交给 render 画柱。
      公开入口仍挂在 bar_chart 下，没有单独的 CmdLayout.histogram。完整预留，即使当前
      生产报告多用 render。
    in_code: "CmdLayout.bar_chart.from_values(..., bins=...)"
    aliases:
      - "from_values 直方图"
    avoid:
      - "另找 CmdLayout.histogram API"

  BarBucket:
    definition: |
      单柱语义：(label, value)，value 为非负计数或权重。公开调用通常传元组或 mapping；
      不必直接构造内部类型。负值在 render 时按 0 处理。
    in_code: "render(buckets=[(label, value), ...] | mapping | BarBucket)"
    aliases:
      - "桶"
      - "柱"
    avoid: []

  bin:
    definition: |
      from_values 等宽分桶的一个区间；bins 参数控制切成几段。全相等样本会收成单柱。
    in_code: "from_values(..., bins=10)"
    aliases:
      - "分桶"
    avoid: []

  title:
    definition: |
      标题命名空间：仅 h1 / h2 / h3 / h4。线宽按终端显示列宽计算（CJK 全角计 2 列）。
    in_code: "CmdLayout.title.h1 / h2 / h3 / h4"
    aliases: []
    avoid:
      - "banner / section（已删除）"

  h1:
    definition: |
      报告总标题：前空行 + 星号框包裹正文。未指定 width 时用正文显示宽度 + pad。
    in_code: "CmdLayout.title.h1(text, *, char='*', width=None, pad=None)"
    aliases:
      - "title.h1"
    avoid: []

  h2:
    definition: |
      大节标题：前空行 + 正文 + 等号下划线；线宽至少 min_width，并跟正文显示宽度取大。
    in_code: "CmdLayout.title.h2(text, *, char='=', min_width=24)"
    aliases:
      - "title.h2"
    avoid: []

  h3:
    definition: |
      小节标题：前空行 + --- 文本 --- 形态。
    in_code: "CmdLayout.title.h3(text, *, char='-')"
    aliases:
      - "title.h3"
    avoid: []

  h4:
    definition: |
      细节标题：前空行 + ### 文本，比 h3 更轻，用于段内小标题。
    in_code: "CmdLayout.title.h4(text)"
    aliases:
      - "title.h4"
    avoid: []

  pad:
    definition: |
      h1 在未指定 width 时，在正文终端列宽之外附加的边距列数（模块内置默认）。
      用来让星号框比正文略宽一圈。
    in_code: "h1(..., pad=...)；DEFAULT_BANNER_PAD"
    aliases: []
    avoid: []

  width:
    definition: |
      条或规则线的宽度（列数）。条形图 width 是条内格子数（最高柱铺满）；标题规则线可按
      正文显示宽度推导。CJK 全角字符计 2 列，按 len() 会算错。
    in_code: "bar_chart.render(..., width=20)；title.h1(..., width=None)"
    aliases: []
    avoid:
      - "用 Python len() 当终端列宽"

  CJK:
    definition: |
      中日韩等全角字符；算终端显示宽度时通常计 2 列。标题 / 表格 / 条形标签对齐依赖
      shared.display.display_width。
    in_code: "shared.display.display_width"
    aliases:
      - "全角字符"
    avoid: []

  display_width:
    definition: |
      把字符串映射为等宽终端列数的函数；CJK 全角计 2。供 title / table / bar_chart 共用。
    in_code: "from core.infra.cmd_layout.shared.display import display_width"
    aliases: []
    avoid:
      - "在业务模块再写一份 east_asian_width 循环"

  table:
    definition: |
      ASCII 对照表命名空间：render / print。首列左齐、其余右齐；列宽按显示宽度（含 CJK）。
    in_code: "CmdLayout.table.render / print"
    aliases:
      - "对照表"
    avoid: []

  text:
    definition: |
      行内排版命名空间：meta（元信息行）、kv（键值）、indent、numbered、bullets 等。
    in_code: "CmdLayout.text.meta / kv / indent / numbered / bullets"
    aliases: []
    avoid: []

  icon:
    definition: |
      跨平台图标命名空间：按正式逻辑名取符号（success / error / bar_chart 等）。
      UTF-8 终端用 emoji；否则 ASCII_fallback。无别名表。
    in_code: "CmdLayout.icon.get / i / supports_emoji；from core.infra.cmd_layout import i"
    aliases: []
    avoid:
      - "deep-import IconService"
      - "使用已删除的别名（chart / failed / ok 等）"

  i:
    definition: |
      icon.get 的短入口：CmdLayout.icon.i，或包根 from core.infra.cmd_layout import i。
      方便在 f-string 里插图标；行为与 get 相同。
    in_code: "i('success')；CmdLayout.icon.i('success')"
    aliases:
      - "icon.i"
    avoid: []

  ASCII_fallback:
    definition: |
      当 stdout 不适合 emoji 时，用 [OK] / [FAIL] 等方括号文本代替彩色表情。
    in_code: "CmdLayout.icon.supports_emoji；IconService 双表"
    aliases:
      - "ascii fallback"
    avoid: []

  emoji:
    definition: |
      图标在支持 UTF-8 的终端上使用的彩色表情形态；与 ASCII_fallback 是同一逻辑名的两套字形。
    in_code: "icon 双表中的 emoji 侧"
    aliases: []
    avoid:
      - "在 bar_chart 填充里用 emoji（条形固定 ASCII）"
