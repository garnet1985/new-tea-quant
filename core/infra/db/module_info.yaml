# 模块元数据
name: infra.db
version: "0.5.0"
compatible_core_versions: ">=0.4.0"
description: "数据库基础设施：门面 Db（类挂靠 API）；契约在 contracts；实现位于 core/。"
dependencies:
  - infra.project_context
changelog:
  - version: "0.5.0"
    changes:
      - "BREAKING：包根仅导出 Db；contracts 仅类型/类/常量，不再导出 create_engine / build_engine_meta"
      - "BREAKING：去掉包根过渡期 re-export（DatabaseManager 等改从 contracts 导入）"
      - "Db 加厚：engine / duckdb.worker_pool / duckdb.wal / sql / rows；删除 process_pool_module()"
      - "依赖穿透治理（不 bump）：process_pool_scope 去掉 DataManager import；set_holder_resolver / ensure_holder_restored（duck-type）；ensure_data_manager_restored 兼容别名"
  - version: "0.4.0"
    changes:
      - 实现下沉至 core/；包根增加 Db 门面与 contracts.py；文档对齐 module-doc-standard
      - 导入路径改为 core.infra.db.core.*；_shared 重命名为 engines/shared
      - 过渡期包根仍 re-export DatabaseManager / DbBaseModel 等
  - version: "0.3.0"
    changes:
      - Engine 挂载架构（mysql / duckdb）；storage_domain 与表级域路由
      - DuckDB 写管道、WAL/checkpoint、process_pool_scope 主进程锁协作
      - storage_registry、duckdb 表文件地图自动生成
  - version: "0.2.0"
    changes:
      - DatabaseManager + ConnectionManager 基线；队列写入与 schema 管理
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能