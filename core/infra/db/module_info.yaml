# 模块元数据
name: infra.db
version: "0.4.0"
compatible_core_versions: ">=0.4.0"
description: "数据库基础设施：门面 Db；实现位于 core/（Engine 挂载、Schema、迁移、表写入）。"
dependencies:
  - infra.project_context
changelog:
  - version: "0.4.0"
    changes:
      - 实现下沉至 core/；包根增加 Db 门面与 contracts.py；文档对齐 module-doc-standard
      - 导入路径改为 core.infra.db.core.*；_shared 重命名为 engines/shared
      - 过渡期包根仍 re-export DatabaseManager / DbBaseModel 等
  - version: "0.3.0"
    changes:
      - Engine 挂载架构（mysql / duckdb）；storage_domain 与表级域路由
      - DuckDB 写管道、WAL/checkpoint、process_pool_scope 主进程锁协作
      - storage_registry、duckdb 表文件地图自动生成
  - version: "0.2.0"
    changes:
      - DatabaseManager + ConnectionManager 基线；队列写入与 schema 管理
