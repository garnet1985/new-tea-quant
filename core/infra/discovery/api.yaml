module: infra.discovery
version: 0.3.0
requires: core>=0.3.0

# ---------------------------------------------------------------------------
# 用语
#
#   Discovery       — Facade，对外唯一入口
#   namespace       — file / discover / class_discovery
#
# ---------------------------------------------------------------------------

---

Discovery:
  layer: facade
  description: "Discovery module facade — file / discover / class_discovery namespace API"

  namespaces:
    file:
      description: "文件操作 namespace"

      apis:
        find_file:
          description: "查找单个文件（向上或向下搜索）"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: start_dir
                type: Path
                required: true
              - name: filename
                type: str
                required: true
            keyword_only:
              - name: search_parents
                type: bool
                required: false
                default: false
                notes: "是否向上搜索父目录（默认向下）"
              - name: max_depth
                type: int
                required: false
                default: 10
          returns: Optional[Path]
          example: |
            # 向下搜索
            path = Discovery.file.find_file(Path("/project"), "settings.json")
            # 向上搜索
            path = Discovery.file.find_file(Path.cwd(), "requirements.txt", search_parents=True)

        load_file_content:
          description: "加载文件内容（自动识别JSON/YAML/文本）"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
            keyword_only:
              - name: encoding
                type: str
                required: false
                default: "'utf-8'"
              - name: auto_detect_format
                type: bool
                required: false
                default: true
          returns: Union[str, Dict[str, Any], bytes, None]
          notes: "根据文件扩展名自动识别格式"
          example: |
            content = Discovery.file.load_file_content(Path("settings.json"))

        load_json:
          description: "加载JSON文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
          returns: Optional[Dict[str, Any]]
          example: |
            data = Discovery.file.load_json(Path("config/settings.json"))

        load_yaml:
          description: "加载YAML文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
          returns: Optional[Dict[str, Any]]
          example: |
            data = Discovery.file.load_yaml(Path("config/settings.yaml"))

        load_text:
          description: "加载文本文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
            keyword_only:
              - name: encoding
                type: str
                required: false
                default: "'utf-8'"
          returns: Optional[str]
          example: |
            text = Discovery.file.load_text(Path("notes.txt"))

        load_python_config:
          description: "加载Python配置文件并提取指定变量"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
            keyword_only:
              - name: var_name
                type: str
                required: false
                default: '"settings"'
          returns: Optional[Dict[str, Any]]
          example: |
            settings = Discovery.file.load_python_config(Path("settings.py"), var_name="settings")

        save_file_content:
          description: "保存文件内容（自动识别JSON/YAML/文本）"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
              - name: content
                type: Union[str, Dict[str, Any], bytes]
                required: true
            keyword_only:
              - name: encoding
                type: str
                required: false
                default: "'utf-8'"
              - name: ensure_parent_exists
                type: bool
                required: false
                default: true
          returns: bool
          example: |
            Discovery.file.save_file_content(Path("settings.json"), {"key": "value"})

        save_json:
          description: "保存JSON文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
              - name: data
                type: Dict[str, Any]
                required: true
            keyword_only:
              - name: encoding
                type: str
                required: false
                default: "'utf-8'"
          returns: bool
          example: |
            Discovery.file.save_json(Path("config/settings.json"), {"key": "value"})

        save_yaml:
          description: "保存YAML文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: file_path
                type: Path
                required: true
              - name: data
                type: Dict[str, Any]
                required: true
            keyword_only:
              - name: encoding
                type: str
                required: false
                default: "'utf-8'"
          returns: bool
          example: |
            Discovery.file.save_yaml(Path("config/settings.yaml"), {"key": "value"})

    discover:
      description: "批量发现 namespace"

      apis:
        files:
          description: "批量发现文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: base_dir
                type: Path
                required: true
            keyword:
              - name: pattern
                type: str
                required: false
                default: '"**/*"'
            keyword_only:
              - name: exclude_patterns
                type: Optional[List[str]]
                required: false
                default: null
              - name: max_depth
                type: int
                required: false
                default: 10
          returns: List[Path]
          example: |
            files = Discovery.discover.files(Path("/project"), "**/*.json")

        directories:
          description: "批量发现目录"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: base_dir
                type: Path
                required: true
            keyword:
              - name: pattern
                type: str
                required: false
                default: '"**/*"'
            keyword_only:
              - name: exclude_patterns
                type: Optional[List[str]]
                required: false
                default: null
              - name: max_depth
                type: int
                required: false
                default: 10
          returns: List[Path]
          example: |
            dirs = Discovery.discover.directories(Path("/project"), "*/")

        files_by_suffix:
          description: "根据扩展名批量发现文件"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: base_dir
                type: Path
                required: true
              - name: suffix
                type: str
                required: true
            keyword_only:
              - name: exclude_patterns
                type: Optional[List[str]]
                required: false
                default: null
              - name: max_depth
                type: int
                required: false
                default: 10
          returns: List[Path]
          notes: "suffix 如 '.json', '.yaml'"
          example: |
            json_files = Discovery.discover.files_by_suffix(Path("/project"), ".json")

        subclasses:
          description: "发现所有继承 base_class 的子类"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: base_class
                type: Type
                required: true
              - name: base_module_path
                type: str
                required: true
            keyword:
              - name: module_name_pattern
                type: str
                required: false
                default: '"{base_module}.{name}"'
            keyword_only:
              - name: key_extractor
                type: Optional[Callable[[Type], str]]
                required: false
                default: null
              - name: class_filter
                type: Optional[Callable[[Type], bool]]
                required: false
                default: null
          returns: Dict[str, Type]
          example: |
            providers = Discovery.discover.subclasses(BaseProvider, "userspace.extensions.providers")

        objects:
          description: "发现所有模块中的特定对象"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: base_module_path
                type: str
                required: true
              - name: object_name
                type: str
                required: true
            keyword:
              - name: module_pattern
                type: str
                required: false
                default: '"{base_module}.{name}"'
            keyword_only:
              - name: skip_modules
                type: Optional[set]
                required: false
                default: null
          returns: Dict[str, Any]
          example: |
            schemas = Discovery.discover.objects(
                base_module_path="userspace.extensions.handlers",
                object_name="SCHEMA"
            )

    class_discovery:
      description: "类发现 namespace（高级用法）"

      apis:
        create_config:
          description: "创建类发现配置"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: base_class
                type: Type
                required: true
              - name: module_name_pattern
                type: str
                required: true
            keyword_only:
              - name: key_extractor
                type: Optional[Callable[[Type], str]]
                required: false
                default: null
              - name: class_filter
                type: Optional[Callable[[Type], bool]]
                required: false
                default: null
              - name: attribute_extractors
                type: Optional[Dict[str, Callable[[Type], Any]]]
                required: false
                default: null
              - name: skip_modules
                type: Optional[set]
                required: false
                default: '{"__pycache__", "__init__"}'
              - name: skip_classes
                type: Optional[set]
                required: false
                default: 'set()'
          returns: DiscoveryConfig
          notes: "返回的 DiscoveryConfig 用于 ClassDiscovery 实例化"
          example: |
            config = Discovery.class_discovery.create_config(BaseProvider, "{base_module}.{name}.provider")

        create:
          description: "创建类发现器实例"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: config
                type: DiscoveryConfig
                required: true
          returns: ClassDiscovery
          example: |
            discovery = Discovery.class_discovery.create(config)

        discover_class_by_path:
          description: "通过完整路径发现单个类"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: class_path
                type: str
                required: true
            keyword:
              - name: base_class
                type: Optional[Type]
                required: false
                default: null
          returns: Optional[Type]
          notes: "class_path 如 'userspace.extensions.handlers.kline.KlineHandler'"
          example: |
            cls = Discovery.class_discovery.discover_class_by_path(
                "userspace.extensions.handlers.kline.KlineHandler"
            )

---