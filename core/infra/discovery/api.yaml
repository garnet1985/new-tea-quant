# API Contract - infra.discovery
# Version: 0.3.0
# Last Updated: 2026-06-27
# Requires: core>=0.3.0
#
# 目的：
#   - 为所有API建立快捷目录
#   - 让开发者和自动测试一目了然
#   - 用户知道有哪些API和怎么用
#   - 测试知道有哪些对外接口和用法，快速覆盖

module: infra.discovery
version: 0.3.0
requires: core>=0.3.0

---

FileUtils:
  layer: implementation
  description: "文件操作工具类（静态方法集合）- 提供原子性的文件查找和加载功能"

  apis:
    find_file:
      description: "查找单个文件（向上或向下搜索）"
      stability: stable
      is_static: true
      parameters:
        - start_dir: Path  # 起始目录
        - filename: str  # 文件名
        - search_parents: bool = False  # 是否向上搜索父目录（默认向下）
        - max_depth: int = 10  # 最大搜索深度
      returns: Optional[Path]  # 文件路径，未找到返回 None
      throws: []
      example: |
        from core.infra.discovery import FileUtils
        # 向下搜索
        path = FileUtils.find_file(Path("/project"), "settings.json")
        # 向上搜索
        path = FileUtils.find_file(Path.cwd(), "requirements.txt", search_parents=True)

    load_file_content:
      description: "加载单个文件内容（自动识别JSON/YAML/文本）"
      stability: stable
      is_static: true
      parameters:
        - file_path: Path  # 文件路径
        - encoding: str = 'utf-8'  # 文本编码
        - auto_detect_format: bool = True  # 是否自动识别格式（根据扩展名）
      returns: Union[str, Dict[str, Any], bytes, None]  # 文件内容，加载失败返回 None
      throws: []
      example: |
        from core.infra.discovery import FileUtils
        content = FileUtils.load_file_content(Path("settings.json"))
        # 返回 dict（因为文件扩展名是 .json）

    load_json:
      description: "加载JSON文件"
      stability: stable
      is_static: true
      parameters:
        - file_path: Path  # 文件路径
      returns: Optional[Dict[str, Any]]  # JSON字典，加载失败返回 None
      throws: []
      example: |
        from core.infra.discovery import FileUtils
        data = FileUtils.load_json(Path("config/settings.json"))

    load_yaml:
      description: "加载YAML文件"
      stability: stable
      is_static: true
      parameters:
        - file_path: Path  # 文件路径
      returns: Optional[Dict[str, Any]]  # YAML字典，加载失败返回 None
      throws: []
      example: |
        from core.infra.discovery import FileUtils
        data = FileUtils.load_yaml(Path("config/settings.yaml"))

    save_file_content:
      description: "保存文件内容（自动识别JSON/YAML/文本）"
      stability: stable
      is_static: true
      parameters:
        - file_path: Path  # 文件路径
        - content: Union[str, Dict[str, Any], bytes]  # 文件内容
        - encoding: str = 'utf-8'  # 文本编码
        - ensure_parent_exists: bool = True  # 是否确保父目录存在
      returns: bool  # 保存成功返回 True，失败返回 False
      throws: []
      example: |
        from core.infra.discovery import FileUtils
        FileUtils.save_file_content(Path("settings.json"), {"key": "value"})

---

FileDiscovery:
  layer: implementation
  description: "批量文件发现工具 - 提供批量文件和目录发现功能"

  apis:
    discover:
      description: "批量发现文件/目录"
      stability: stable
      is_static: false
      parameters:
        - use_cache: bool = True  # 是否使用缓存
      returns: List[Path]  # 文件/目录路径列表
      throws: []
      example: |
        from core.infra.discovery import FileDiscovery, FileDiscoveryConfig
        config = FileDiscoveryConfig(
            base_dir=Path("/project/strategies"),
            pattern="**/settings.json"
        )
        discovery = FileDiscovery(config)
        files = discovery.discover()

    discover_with_metadata:
      description: "批量发现文件并提取元数据"
      stability: stable
      is_static: false
      parameters:
        - use_cache: bool = True  # 是否使用缓存
      returns: Dict[str, Dict[str, Any]]  # {file_path_str: {"size": ..., "mtime": ..., "type": ...}}
      throws: []
      example: |
        from core.infra.discovery import FileDiscovery, FileDiscoveryConfig
        config = FileDiscoveryConfig(base_dir=Path("/project"))
        discovery = FileDiscovery(config)
        metadata = discovery.discover_with_metadata()

    clear_cache:
      description: "清除缓存"
      stability: stable
      is_static: false
      parameters:
        - "无参数"
      returns: None
      throws: []
      example: |
        discovery.clear_cache()

---

# Convenience Functions - 便捷函数（模块级函数）

ConvenienceFunctions:
  layer: implementation
  description: "便捷函数集合 - 提供简化的模块级函数，直接调用底层 FileUtils/FileDiscovery"

  apis:
    find_file:
      description: "便捷函数：查找单个文件"
      stability: stable
      is_static: true
      parameters:
        - start_dir: Path  # 起始目录
        - filename: str  # 文件名
        - search_parents: bool = False  # 是否向上搜索父目录
      returns: Optional[Path]  # 文件路径，未找到返回 None
      throws: []
      example: |
        from core.infra.discovery import find_file
        path = find_file(Path("/project"), "settings.json")

    load_json:
      description: "便捷函数：加载JSON文件"
      stability: stable
      is_static: true
      parameters:
        - file_path: Path  # 文件路径
      returns: Optional[Dict[str, Any]]  # JSON字典，加载失败返回 None
      throws: []
      example: |
        from core.infra.discovery import load_json
        data = load_json(Path("config/settings.json"))

    discover_files:
      description: "便捷函数：批量发现文件"
      stability: stable
      is_static: true
      parameters:
        - base_dir: Path  # 基础目录
        - pattern: str = "**/*"  # glob pattern
        - exclude_patterns: Optional[List[str]] = None  # 排除模式列表
        - max_depth: int = 10  # 最大搜索深度
      returns: List[Path]  # 文件路径列表
      throws: []
      example: |
        from core.infra.discovery import discover_files
        files = discover_files(Path("/project"), "**/*.json")

    discover_directories:
      description: "便捷函数：批量发现目录"
      stability: stable
      is_static: true
      parameters:
        - base_dir: Path  # 基础目录
        - pattern: str = "**/*"  # glob pattern
        - exclude_patterns: Optional[List[str]] = None  # 排除模式列表
        - max_depth: int = 10  # 最大搜索深度
      returns: List[Path]  # 目录路径列表
      throws: []
      example: |
        from core.infra.discovery import discover_directories
        dirs = discover_directories(Path("/project"), "*/")

    discover_files_by_suffix:
      description: "便捷函数：根据扩展名批量发现文件"
      stability: stable
      is_static: true
      parameters:
        - base_dir: Path  # 基础目录
        - suffix: str  # 文件扩展名（如 ".json", ".yaml"）
        - exclude_patterns: Optional[List[str]] = None  # 排除模式列表
        - max_depth: int = 10  # 最大搜索深度
      returns: List[Path]  # 文件路径列表
      throws: []
      example: |
        from core.infra.discovery import discover_files_by_suffix
        json_files = discover_files_by_suffix(Path("/project"), ".json")

    discover_subclasses:
      description: "便捷函数：发现所有继承 base_class 的子类"
      stability: stable
      is_static: true
      parameters:
        - base_class: Type  # 基类
        - base_module_path: str  # 基础模块路径
        - module_name_pattern: str = "{base_module}.{name}"  # 模块名模式
        - key_extractor: Optional[Callable[[Type], str]] = None  # 键提取函数
        - class_filter: Optional[Callable[[Type], bool]] = None  # 类过滤函数
      returns: Dict[str, Type]  # {key: class} 字典
      throws: []
      example: |
        from core.infra.discovery import discover_subclasses
        providers = discover_subclasses(BaseProvider, "userspace.extensions.providers")

---

ClassDiscovery:
  layer: implementation
  description: "批量类发现工具 - 提供通用的类自动发现功能"

  apis:
    discover:
      description: "发现指定包下的所有类"
      stability: stable
      is_static: false
      parameters:
        - base_module_path: str  # 基础模块路径（如 "userspace.extensions.data_source.providers"）
        - use_cache: bool = True  # 是否使用缓存
      returns: DiscoveryResult  # 发现结果（包含 classes 字典和 metadata）
      throws: []
      example: |
        from core.infra.discovery import ClassDiscovery, DiscoveryConfig
        config = DiscoveryConfig(
            base_class=BaseProvider,
            module_name_pattern="{base_module}.{name}.provider"
        )
        discovery = ClassDiscovery(config)
        result = discovery.discover("userspace.extensions.data_source.providers")

    discover_class_by_path:
      description: "通过完整路径发现单个类"
      stability: stable
      is_static: false
      parameters:
        - class_path: str  # 类的完整路径（如 "userspace.extensions.handlers.kline.KlineHandler"）
        - base_class: Optional[Type] = None  # 可选的基类验证
      returns: Optional[Type]  # 类对象，未找到返回 None
      throws: []
      example: |
        cls = discovery.discover_class_by_path("userspace.extensions.handlers.kline.KlineHandler")

---

ModuleDiscovery:
  layer: implementation
  description: "批量模块发现工具 - 提供通用的模块自动发现功能"

  apis:
    discover_objects:
      description: "发现所有模块中的特定对象"
      stability: stable
      is_static: true
      parameters:
        - base_module_path: str  # 基础模块路径
        - object_name: str  # 对象名（如 "SCHEMA", "CONFIG"）
        - module_pattern: str = "{base_module}.{name}"  # 模块路径模式
        - skip_modules: set = None  # 跳过的模块名集合
      returns: Dict[str, Any]  # {key: object} 字典
      throws: []
      example: |
        from core.infra.discovery import ModuleDiscovery
        schemas = ModuleDiscovery.discover_objects(
            base_module_path="userspace.extensions.handlers",
            object_name="SCHEMA"
        )

---

# API稳定性分级定义
api_stability_levels:
  stable:
    description: "API稳定，不会轻易修改"
    breaking_change_risk: low

  beta:
    description: "API可能调整，但会提前通知"
    breaking_change_risk: medium

  experimental:
    description: "API可能随时修改，仅供实验"
    breaking_change_risk: high

  deprecated:
    description: "API已废弃，将在未来版本删除"
    breaking_change_risk: high