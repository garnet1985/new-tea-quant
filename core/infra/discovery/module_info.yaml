      - 正式版本之前所有API标注beta状态
  - version: "0.1.1"
    changes:
      - 新增 FileUtils（单个文件操作）
      - 新增 FileDiscovery（批量文件发现）
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
      - 快捷发现文件/类/文件夹等，方便外部调用
