# 模块元数据
name: infra.discovery
version: "0.2.1"
compatible_core_versions: ">=0.4.0"
description: "发现模块：自动发现一些带有特征的文件/类/文件夹的模块，用来服务于用户自定义的功能文件和类。"
dependencies: []
changelog:
  - version: "0.2.1"
    changes:
      - 标准化模块，标准化文档以及对外API
