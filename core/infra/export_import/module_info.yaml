name: infra.export_import
version: "0.2.1"
compatible_core_versions: ">=0.5.0"
package: core.infra
description: "导入导出模块：打包，压缩等等对批量或者单个文件的操作模块，主要服务于文件导入导出功能。"
# 站点文档（可选；Drupal title / display title）
site_title: "导入导出模块 (Export / Import)"
site_display_title: "打包释放基础功能 - Export / Import 模块"
dependencies: []
changelog:
  - version: "0.2.1"
    changes:
      - 门面 archive/install/types 改为实例挂载（与 Discovery 一致）；删除空 core/__init__
      - ARCHITECTURE 补全 Mermaid 数据流
  - version: "0.2.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 修改了暴露的API参数，函数，防止外部模块直接调用包内非公开接口
      - 正式版本之前所有API标注beta状态
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
      - 支持目录收集（运行时目录排除）
      - 支持zip打包和解压
      - 支持安装前冲突预检，支持 拒绝/跳过/复写 行为
