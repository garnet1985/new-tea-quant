# API Contract - infra.machine_capacity
module: infra.machine_capacity
version: 0.1.0
requires: core>=0.4.0

---

MachineCapacity:
  layer: type
  description: "机器容量快照（cpu_count / memory_budget_mb / memory_floor_mb / reserve_cores）"

MachineInfo:
  layer: facade
  description: "从 performance 字典解析机器容量与 worker 可用度"

  apis:
    get_capacity:
      description: "综合 CPU / 预留核 / 内存预算，返回 MachineCapacity"
      stability: stable
      type: static_method
      parameters:
        - performance: Dict[str, Any]
      returns: MachineCapacity
      usage: |
        from core.infra.machine_capacity import MachineInfo
        capacity = MachineInfo.get_capacity(performance)

    get_cpu_count:
      description: "逻辑 CPU 数（至少 1）"
      stability: stable
      type: static_method
      returns: int

    get_reserve_cores:
      description: "从 performance.reserve_cores 解析预留核数"
      stability: stable
      type: static_method
      parameters:
        - performance: Dict[str, Any]
      returns: int

    resolve_memory_budget:
      description: "返回 (worker 可用预算 MB, memory_floor_mb)；支持 auto"
      stability: stable
      type: static_method
      parameters:
        - performance: Dict[str, Any]
      returns: Tuple[float, float]

    resolve_memory_floor:
      description: "机器必须保留的空闲内存底线（MB）"
      stability: stable
      type: static_method
      parameters:
        - performance: Dict[str, Any]
      returns: float

    get_available_workers:
      description: "cpu_count − reserve_cores（至少 1）"
      stability: stable
      type: static_method
      parameters:
        - capacity: MachineCapacity
      returns: int

    worker_pool_budget_mb:
      description: "进程池可用内存预算（MB）"
      stability: stable
      type: static_method
      parameters:
        - capacity: MachineCapacity
      returns: float

    parse_max_parallel_jobs_cap:
      description: "解析 max_parallel_jobs_cap（None / int）"
      stability: stable
      type: static_method
      parameters:
        - raw: Any
      returns: Optional[int]
