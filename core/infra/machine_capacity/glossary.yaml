# Glossary - infra.machine_capacity
module: infra.machine_capacity
version: 0.1.0

---

recommended_terms:
  MachineCapacity:
    meaning: "机器容量快照：CPU、内存预算、内存底线、预留核"
  MachineInfo:
    meaning: "容量 Facade：从 performance 解析 MachineCapacity 与 worker 可用度"
  memory_budget_mb:
    meaning: "可分配给 worker 池的内存预算（MB）；可为 auto"
  memory_floor_mb:
    meaning: "机器必须保留的空闲内存底线（MB），不参与 worker 预算"
  reserve_cores:
    meaning: "为系统/主进程预留的逻辑核数"
  worker_memory_fraction:
    meaning: "在 (available − floor) 上再取的可用比例，默认 0.85"
  max_parallel_jobs_cap:
    meaning: "并行 job 数上限；None 表示不封顶"

forbidden_terms:
  - term: "WorkerProbe（本模块）"
    reason: "并行度 auto 解析在 BacktestEngine.entity_based.probe；本模块只提供容量原语"
  - term: "把 MachineInfo 再 export 到业务模块空壳"
    reason: "调用方直接 from core.infra.machine_capacity import …"
