# 模块元数据
name: infra.machine_capacity
version: "0.2.1"
compatible_core_versions: ">=0.4.0"
description: "机器能力探测模块：获取当前用户机器的能力信息的模块，用于给大性能需求的任务提供规划信息。"
dependencies: []
changelog:
  - version: "0.2.1"
    changes:
      - 新增 MachineInfo.get_disk_type：探测硬盘类型 ssd/hdd/unknown
  - version: "0.2.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 修改了暴露的API参数，函数，防止外部模块直接调用包内非公开接口
      - 正式版本之前所有API标注beta状态
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能：从单文件提升为 infra 子模块
      - 提供基本机器参数的API，比如提供系统内存和CPU的容量信息等等，方便外部调用
