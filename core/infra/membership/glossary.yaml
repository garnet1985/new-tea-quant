# Membership 术语表
# Version: 0.1.0
#
# 目的：解释本模块名词；同一事物在不同背景下的别名 / 易混名（aliases vs avoid）

terms:
  通用凭证:
    definition: "官网会员中心签发的一串 token，格式为 `ntq_` + 48 位小写十六进制；本机会员能力的唯一凭据"
    aliases:
      - "membership token"
      - "会员凭证"
    avoid:
      - "密码"
      - "API Key（AI 供应商的 key 走 infra.ai，不经过本模块）"

  凭证文件:
    definition: "存放通用凭证的本地文本文件，固定位于 userspace/system/membership/membership_token.txt；支持 `#` 注释行，取第一行有效内容"
    aliases:
      - "membership_token.txt"
    avoid: []

  configured:
    definition: "status 字段：凭证文件存在且内容为有效通用凭证"
    aliases: []
    avoid:
      - "已登录（本模块不校验在线状态，configured 不代表凭证在官网侧仍然有效）"

  invalid:
    definition: "status 字段：凭证文件存在但内容不符合通用凭证格式（例如粘贴残缺或写入了别的东西）"
    aliases: []
    avoid:
      - "过期（是否过期由官网侧判定，本模块不感知）"
