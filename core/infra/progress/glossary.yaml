# Progress 术语表
# Version: 0.2.3
# Compatible-Core: >=0.6.0
#
# 目的：解释本模块代码 / API 中出现的英文概念（是什么、为何存在、代码对应、关键对比）。
# aliases / avoid 只做命名纪律，不能代替解释。
# 本模块只写进度树 / 频道快照；不存业务结果、机会列表、失败日志。「谁在跑」见 infra.job_pipeline。

terms:
  Progress:
    definition: |
      进度文件 Facade：一次任务一棵 JSON 进度树（或频道化 job 快照），供 CLI / BFF / 安装脚本
      同一套读取。短时间多次 tick 会合并写盘。不管「全局是否允许再开长任务」——那是 JobPipeline；
      本模块回答「这个任务内部做到哪了」。
    in_code: "from core.infra.progress import Progress；start / tick / finish / read / channel"
    aliases: []
    avoid:
      - "把 Progress 当成「谁在跑」的管道真相源"
      - "在进度文件里塞业务结果列表"

  Node:
    definition: |
      进度树上的一个节点：有 id、label、weight、status、done/total 或子 steps。
      根节点和 steps 里每一项都是同一套结构，不要把步骤做成字段更少的另一种类型。
    in_code: "contracts 节点结构；Progress.start(..., steps=[{id, ...}, ...])"
    aliases:
      - "进度节点"
    avoid:
      - "把步骤做成另一种字段更少的结构"

  Root:
    definition: |
      一次任务最外层节点；一个根对应一个进度文件（node_id 作文件名，不能含路径分隔符）。
      Progress.start(node_id, ...) 创建或覆盖这棵树。
    in_code: "Progress.start(node_id, ...)；progress/{node_id}.json（树形根文件）"
    aliases:
      - "根节点"
    avoid:
      - "把 Root 叫成 module"
      - "node_id 里带 / 或 \\"

  Leaf:
    definition: |
      steps 为空的节点：自己的 ratio 来自 done / total。只有叶子能 tick；
      在有子节点的父节点上 tick 会报错——父节点进度由子节点按 weight 汇总。
    in_code: "Progress.tick(leaf_id, done, total, ...)"
    aliases:
      - "叶子"
    avoid:
      - "在有子节点的节点上调用 tick"

  Ratio:
    definition: |
      0～1 的完成比例。叶子 = done/total；有子节点时按各子 weight 加权汇总；完成时为 1。
      UI 直接读 ratio / percent，不要在界面再算一遍权重。
    in_code: "节点 ratio 字段；JobPipeline 挂载的 progress.ratio / percent"
    aliases:
      - "比例"
      - "percent"
    avoid:
      - "由界面再算一遍权重"

  Weight:
    definition: |
      节点相对同级的权重，省略时为 1。父 ratio 按子 weight 加权。
      weight=0 表示不推动父节点 ratio（仍可显示该步），不是「没有这个节点」。
    in_code: "start(..., weight=...)；steps 项里的 weight"
    aliases:
      - "权重"
    avoid:
      - "把 0 当成没这个节点的状态"

  tick:
    definition: |
      更新一个叶子的 done/total，标为 running，并可打一行日志。调用一次更新一次；
      短时间密集 tick 会合并写盘。不要对父节点 tick。
    in_code: "Progress.tick(node_id, done, total, *, source, label, detail, log)"
    aliases: []
    avoid:
      - "对非叶子 tick"

  Channel:
    definition: |
      频道化 job 快照命名空间：路径 progress/{channel}/{file_key}.json，与树形根文件并列。
      用于按业务域分隔一批 job 进度文件。infra 不写死 strategy / tag 等 channel 名——由调用方传入。
      不要把内部 ProgressRecorder 当成公开导出。
      注意：树形节点的 updated_at 是 unix int；channel 快照的 updated_at 是 ISO UTC 字符串。
    in_code: "Progress.channel...；progress/{channel}/{file_key}.json"
    aliases:
      - "频道"
    avoid:
      - "在 infra 里写死 strategy / tag 等业务 channel 名"
      - "把 ProgressRecorder 当成 infra 公开导出"

  drain:
    definition: |
      立刻把内存里尚未落盘的进度树写到磁盘。默认写盘有合并延迟（见 NTQ_PROGRESS_FLUSH_DELAY）；
      安装子进程或 BFF 轮询前应先 drain，否则另一进程可能读到旧文件。
    in_code: "Progress.drain()"
    aliases:
      - "flush"
    avoid:
      - "把 drain 当成业务「完成进度」"

  prune:
    definition: |
      启动新根树时顺带清理过期已结束进度文件，运行中的文件保留。阈值与保留天数见 progress_constants。
    in_code: "store 内 prune；由 Progress.start 触发"
    aliases: []
    avoid:
      - "手删 userspace progress 目录当正式 API"

  NTQ_PROGRESS_DIR:
    definition: |
      覆盖进度根目录的环境变量。单测常用临时目录；未设时走 ProjectContext / 默认 tmp。
    in_code: "os.environ['NTQ_PROGRESS_DIR']；paths.resolve_progress_directory"
    aliases: []
    avoid: []

  NTQ_PROGRESS_FLUSH_DELAY:
    definition: |
      合并写盘延迟（秒）。设为 0 时 tick 后尽快落盘；默认见 progress_constants。
    in_code: "os.environ['NTQ_PROGRESS_FLUSH_DELAY']"
    aliases: []
    avoid: []
