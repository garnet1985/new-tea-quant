name: infra.progress
version: 0.2.1
compatible_core_versions: ">=0.6.0"
package: core.infra
description: "进度模块：按节点 id 写入统一的进度文件，供界面和 PHP 直接读取。"
# 站点文档（可选；Drupal title / display title）
site_title: "进度模块 (Progress)"
site_display_title: "统一管理进度记录 - Progress 模块"
dependencies:
  - infra.project_context
changelog:
  - version: "0.2.1"
    changes:
      - "新增 Progress.channel：频道化 job 快照落盘（path/write/read/clear）"
      - "与树形进度共用 NTQ_PROGRESS_DIR；infra 不承载业务 channel 名"
      - "包根仍仅导出 Progress（不导出 ProgressRecorder）"
  - version: "0.2.0"
    changes:
      - 一个根节点一份文件，steps 里嵌套同一种进度节点
      - 按节点 id 查找，调用一次 tick 更新一次
      - 写入时算好 ratio；读取接口立刻看到最新内容，写盘合并进行
      - 去掉 open / step / sub / close / fraction
  - version: "0.1.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 正式版本之前所有API标注beta状态
      - 提供 Progress.open / step / sub / close / read
      - 进度文件放在 userspace/.ntq/tmp/progress.json
      - 同一时间只记录当前这一次任务
