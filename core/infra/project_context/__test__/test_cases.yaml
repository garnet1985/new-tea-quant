# Project Context unit test case registry.
# Each case maps to one test file; scenarios align with test function names.

cases:
  - id: 1
    case: api
    description: ProjectContext 公开 API 与 namespace 导出
    file: test_api.py
    scenarios:
      - id: 1
        name: test_facade_export
        description: facade 导出 path / config / meta / cache / discovery namespace
      - id: 2
        name: test_path_namespace_methods
        description: path namespace 包含所有路径 API
      - id: 3
        name: test_config_namespace_methods
        description: config namespace 包含配置加载 API
      - id: 4
        name: test_meta_namespace_methods
        description: meta namespace 包含元数据 API
      - id: 5
        name: test_cache_namespace_methods
        description: cache namespace 包含缓存管理 API
      - id: 6
        name: test_discovery_namespace_methods
        description: discovery namespace 包含配置发现 API
      - id: 7
        name: test_path_get_project_root
        description: get_project_root 返回有效项目根目录
      - id: 8
        name: test_path_get_core_root
        description: get_core_root 返回有效 core 目录
      - id: 9
        name: test_path_get_userspace_root
        description: get_userspace_root 返回有效 userspace 目录
      - id: 10
        name: test_config_load_core_config
        description: load_core_config 加载并合并配置
      - id: 11
        name: test_config_get_default_start_date
        description: get_default_start_date 返回日期字符串
      - id: 12
        name: test_meta_core_version
        description: core_version 返回版本号或 None
      - id: 13
        name: test_meta_core_info
        description: core_info 返回 meta 信息或 None
      - id: 14
        name: test_cache_clear_userspace_cache
        description: clear_userspace_cache 清理路径缓存
      - id: 15
        name: test_discovery_discover_configs
        description: discover_configs 发现配置 ID 列表
      - id: 16
        name: test_discovery_load_overridable_config_success
        description: load_overridable_config 加载并合并配置
      - id: 17
        name: test_discovery_load_overridable_config_not_found
        description: load_overridable_config 未找到抛出 OverridableConfigNotFoundError

  - id: 2
    case: path_manager
    description: PathManager 内部实现与路径计算
    file: test_path_manager.py
    scenarios:
      - id: 1
        name: test_get_project_root
        description: 项目根目录计算
      - id: 2
        name: test_get_userspace_root_with_env
        description: userspace 环境变量优先级
      - id: 3
        name: test_clear_userspace_cache
        description: userspace 缓存清理

  - id: 3
    case: config_manager
    description: ConfigManager 内部实现与配置合并
    file: test_config_manager.py
    scenarios:
      - id: 1
        name: test_load_core_config
        description: 加载 core 默认配置
      - id: 2
        name: test_load_core_config_with_userspace
        description: 合并 userspace 配置
      - id: 3
        name: test_load_database_config
        description: 加载数据库配置
      - id: 4
        name: test_get_as_of_latest_completed_trading_date
        description: 获取 as_of 配置

  - id: 4
    case: discovery_manager
    description: DiscoveryManager 内部实现与配置发现
    file: test_discovery_manager.py
    scenarios:
      - id: 1
        name: test_discover_configs
        description: 发现配置 ID
      - id: 2
        name: test_load_overridable_config
        description: 加载可覆盖配置
      - id: 3
        name: test_load_overridable_config_not_found
        description: 配置未找到抛出异常

  - id: 5
    case: contracts
    description: ProjectContext contracts 类型与异常
    file: test_api.py
    scenarios:
      - id: 1
        name: test_overridable_config_not_found_error_import
        description: OverridableConfigNotFoundError 可从 contracts 导入
      - id: 2
        name: test_overridable_config_not_found_error_is_file_not_found_error
        description: OverridableConfigNotFoundError 继承 FileNotFoundError