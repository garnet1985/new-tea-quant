module: infra.project_context
version: 0.4.0
requires: core>=0.4.0

# ---------------------------------------------------------------------------
# 用语
#
#   ProjectContext  — Facade，对外唯一入口
#   namespace       — path / config / meta / cache / discovery
#   userspace       — 用户工作空间根目录（环境变量 NEW_TEA_QUANT_USERSPACE_ROOT）
#
# ---------------------------------------------------------------------------

# parameters 写法约定（全文件统一）
#
#   positional:     必须按顺序传递的前 N 个参数（可无默认值）
#   keyword_only:   仅允许关键字传递（Python 签名中 * 之后）
#   keyword:        可关键字传递的可选参数（含默认值）
#
# 每个参数条目字段：
#   name, type, required, default, kind: positional | keyword_only | keyword

---

ProjectContext:
  layer: facade
  description: "项目上下文管理 Facade — path / config / meta / cache / discovery namespace API"

  namespaces:
    path:
      description: "路径操作 namespace"

      apis:
        get_project_root:
          description: "获取项目根目录绝对路径"
          stability: stable
          binding: static
          parameters: {}
          returns: Path
          example: |
            root = ProjectContext.path.get_project_root()

        get_core_root:
          description: "获取 core 目录绝对路径"
          stability: stable
          binding: static
          parameters: {}
          returns: Path
          example: |
            core_dir = ProjectContext.path.get_core_root()

        get_userspace_root:
          description: "获取 userspace 目录绝对路径"
          stability: stable
          binding: static
          parameters: {}
          returns: Path
          notes: "优先级：NEW_TEA_QUANT_USERSPACE_ROOT > NTQ_USERSPACE_ROOT > 默认路径"
          example: |
            userspace = ProjectContext.path.get_userspace_root()

        get_strategies_root:
          description: "获取策略根目录绝对路径"
          stability: stable
          binding: static
          parameters: {}
          returns: Path
          notes: "路径：userspace/strategies/"
          example: |
            strategies_root = ProjectContext.path.get_strategies_root()

        get_tags_root:
          description: "获取 Tag 根目录绝对路径"
          stability: stable
          binding: static
          parameters: {}
          returns: Path
          notes: "路径：userspace/extensions/tags/"
          example: |
            tags_root = ProjectContext.path.get_tags_root()

        get_strategy_directory:
          description: "获取指定策略的目录路径"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: strategy_name
                type: str
                required: true
          returns: Path
          notes: "路径：userspace/strategies/{strategy_name}/"
          example: |
            strategy_dir = ProjectContext.path.get_strategy_directory("example")

        get_tag_directory:
          description: "获取指定 Tag scenario 的目录路径"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: tag_name
                type: str
                required: true
          returns: Path
          notes: "路径：userspace/extensions/tags/{tag_name}/"
          example: |
            tag_dir = ProjectContext.path.get_tag_directory("example")

    config:
      description: "配置管理 namespace"

      apis:
        load_core_config:
          description: "加载 core 配置（自动合并 userspace 配置）"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: config_name
                type: str
                required: true
            keyword_only:
              - name: deep_merge_fields
                type: Optional[Set[str]]
                required: false
                default: null
              - name: override_fields
                type: Optional[Set[str]]
                required: false
                default: null
          returns: Dict[str, Any]
          notes: |
            加载流程：
            1. 加载 core/default_config/{config_name}.json（默认配置）
            2. 加载 userspace/config/{config_name}.json（用户配置，如果存在）
            3. 深度合并：用户配置覆盖默认配置
          example: |
            settings = ProjectContext.config.load_core_config("logging")

        load_database_config:
          description: "加载数据库配置（自动合并 userspace 配置）"
          stability: stable
          binding: static
          parameters:
            keyword:
              - name: database_type
                type: Optional[str]
                required: false
                default: null
          returns: Dict[str, Any]
          notes: |
            加载流程：
            1. 加载 core/default_config/database/common.json（公用配置）
            2. 加载 core/default_config/database/{database_type}.json
            3. 合并 userspace/config/database/*.json（如果存在）
          example: |
            db_config = ProjectContext.config.load_database_config("duckdb")

        load_data_config:
          description: "加载 data.json 配置"
          stability: stable
          binding: static
          parameters: {}
          returns: Dict[str, Any]
          example: |
            data_config = ProjectContext.config.load_data_config()

        get_as_of_latest_completed_trading_date:
          description: "获取 data.json 的 as_of_latest_completed_trading_date 配置（全系统 as-of 权威）"
          stability: stable
          binding: static
          parameters: {}
          returns: Optional[str]
          notes: "YYYYMMDD 格式日期字符串，或 None"
          example: |
            as_of = ProjectContext.config.get_as_of_latest_completed_trading_date()

        get_default_start_date:
          description: "获取 data.json 的 default_start_date 配置"
          stability: stable
          binding: static
          parameters: {}
          returns: str
          notes: "YYYYMMDD 格式日期字符串"
          example: |
            start_date = ProjectContext.config.get_default_start_date()

    meta:
      description: "元数据操作 namespace"

      apis:
        core_version:
          description: "获取 core 版本号"
          stability: stable
          binding: static
          parameters: {}
          returns: Optional[str]
          example: |
            version = ProjectContext.meta.core_version()

        core_info:
          description: "获取 core meta 信息"
          stability: stable
          binding: static
          parameters: {}
          returns: Optional[Dict[str, Any]]
          example: |
            meta = ProjectContext.meta.core_info()

    cache:
      description: "缓存管理 namespace"

      apis:
        clear_userspace_cache:
          description: "清理 userspace 路径缓存"
          stability: stable
          binding: static
          parameters: {}
          returns: None
          notes: "清理后下次调用 get_userspace_root 会重新计算"
          example: |
            ProjectContext.cache.clear_userspace_cache()

    discovery:
      description: "配置发现 namespace"

      apis:
        discover_configs:
          description: "发现指定 domain 的所有配置"
          stability: stable
          binding: static
          parameters:
            keyword:
              - name: domain
                type: str
                required: false
                default: '""'
            keyword_only:
              - name: pattern
                type: str
                required: false
                default: '"*.json"'
          returns: List[str]
          notes: "扫描 core / userspace 下指定 domain 的 JSON 配置 id（无后缀），并集排序"
          example: |
            configs = ProjectContext.discovery.discover_configs("markets")

        load_overridable_config:
          description: "加载可覆盖配置"
          stability: stable
          binding: static
          parameters:
            positional:
              - name: domain
                type: str
                required: true
              - name: config_id
                type: str
                required: true
            keyword_only:
              - name: merge_fn
                type: Optional[Callable]
                required: false
                default: null
              - name: deep_merge_fields
                type: Optional[Set[str]]
                required: false
                default: null
              - name: override_fields
                type: Optional[Set[str]]
                required: false
                default: null
              - name: file_type
                type: str
                required: false
                default: '"json"'
          returns: Dict[str, Any]
          throws:
            - OverridableConfigNotFoundError: core 与 userspace 均未找到有效配置
          example: |
            config = ProjectContext.discovery.load_overridable_config("markets", "china_a_stock")

---

OverridableConfigNotFoundError:
  layer: contracts
  description: "可覆盖配置未找到异常：core 与 userspace 均无有效文件"
  notes: "从 contracts.py 导入使用"

---