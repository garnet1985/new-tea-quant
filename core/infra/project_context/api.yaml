# API Contract - infra.project_context
# Version: 0.4.0
# Last Updated: 2026-06-26
#
# 目的：
#   - 为所有API建立快捷目录
#   - 让开发者和自动测试一目了然
#   - 用户知道有哪些API和怎么用
#   - 测试知道有哪些对外接口和用法，快速覆盖

---

ProjectContextManager:
  layer: facade
  description: "项目上下文管理器 - Facade，对外唯一入口"

  apis:
    # ========== 路径核心 API（5个）==========

    get_project_root():
      description: "获取项目根目录的绝对路径"
      stability: stable
      parameters: []
      returns: Path  # 项目根目录路径（绝对路径）
      throws: []
      example: |
        ctx = ProjectContextManager()
        root = ctx.get_project_root()
        # /path/to/new-tea-quant

    get_core_root():
      description: "获取 core 目录的绝对路径"
      stability: stable
      parameters: []
      returns: Path  # core目录路径（绝对路径）
      throws: []
      example: |
        ctx = ProjectContextManager()
        core_dir = ctx.get_core_root()
        # /path/to/new-tea-quant/core

    get_userspace_root():
      description: "获取 userspace 目录的绝对路径"
      stability: stable
      parameters: []
      returns: Path  # userspace目录路径（绝对路径）
      throws: []
      environment_dependencies:
        - NEW_TEA_QUANT_USERSPACE_ROOT  # 最高优先级
        - NTQ_USERSPACE_ROOT  # 次优先级
      example: |
        ctx = ProjectContextManager()
        userspace = ctx.get_userspace_root()
        # /path/to/userspace

    get_strategy_directory(strategy_name):
      description: "获取指定策略的目录路径"
      stability: stable
      parameters:
        - strategy_name: str  # 策略名称
      returns: Path  # 策略目录路径：userspace/strategies/{strategy_name}/
      throws: []
      example: |
        ctx = ProjectContextManager()
        strategy_dir = ctx.get_strategy_directory("example")
        # /path/to/userspace/strategies/example

    get_tag_directory(tag_name):
      description: "获取指定 Tag scenario 的目录路径"
      stability: stable
      parameters:
        - tag_name: str  # Tag scenario名称
      returns: Path  # Tag目录路径：userspace/extensions/tags/{tag_name}/
      throws: []
      example: |
        ctx = ProjectContextManager()
        tag_dir = ctx.get_tag_directory("example")
        # /path/to/userspace/extensions/tags/example

    # ========== 配置核心 API（3个）==========

    load_core_config(config_name):
      description: "加载 core 配置"
      stability: stable
      parameters:
        - config_name: str  # 配置名称（如 'logging', 'database'）
      returns: Dict[str, Any]  # 配置字典
      throws: []
      example: |
        ctx = ProjectContextManager()
        settings = ctx.load_core_config("logging")
        # {"level": "INFO", "format": "..."}

    load_database_config(database_type):
      description: "加载数据库配置"
      stability: stable
      parameters:
        - database_type: Optional[str] = None  # 数据库类型（如 'duckdb', 'postgres'）
      returns: Dict[str, Any]  # 数据库配置字典
      throws: []
      example: |
        ctx = ProjectContextManager()
        db_config = ctx.load_database_config("duckdb")
        # {"type": "duckdb", "path": "..."}

    load_data_config():
      description: "加载 data.json 配置"
      stability: stable
      parameters: []
      returns: Dict[str, Any]  # data配置字典
      throws: []
      example: |
        ctx = ProjectContextManager()
        data_config = ctx.load_data_config()
        # {"data_sources": {...}}

    # ========== 发现核心 API（3个）==========

    discover_strategies():
      description: "发现所有策略"
      stability: stable
      parameters: []
      returns: List[str]  # 策略名称列表
      throws: []
      example: |
        ctx = ProjectContextManager()
        strategies = ctx.discover_strategies()
        # ["example", "test_strategy"]

    discover_tags():
      description: "发现所有 Tag scenario"
      stability: stable
      parameters: []
      returns: List[str]  # Tag scenario名称列表
      throws: []
      example: |
        ctx = ProjectContextManager()
        tags = ctx.discover_tags()
        # ["example", "test_tag"]

    discover_configs():
      description: "发现所有 core 配置"
      stability: stable
      parameters: []
      returns: Dict[str, Dict[str, Any]]  # 配置名称到配置字典的映射
      throws: []
      example: |
        ctx = ProjectContextManager()
        configs = ctx.discover_configs()
        # {"logging": {...}, "database": {...}}

    # ========== 文件核心 API（2个）==========

    find_file(filename, search_dir, recursive):
      description: "查找单个文件"
      stability: stable
      parameters:
        - filename: str  # 文件名
        - search_dir: Path  # 搜索目录
        - recursive: bool = True  # 是否递归搜索
      returns: Optional[Path]  # 文件路径，未找到返回 None
      throws: []
      example: |
        ctx = ProjectContextManager()
        file_path = ctx.find_file("settings.py", Path("userspace/strategies"))
        # /path/to/userspace/strategies/example/settings.py

    load_file_content(path, encoding):
      description: "加载文件内容"
      stability: stable
      parameters:
        - path: Path  # 文件路径
        - encoding: str = "utf-8"  # 文件编码
      returns: Optional[str]  # 文件内容，文件不存在返回 None
      throws: []
      example: |
        ctx = ProjectContextManager()
        content = ctx.load_file_content(Path("settings.py"))
        # "content of settings.py"

    # ========== 元数据核心 API（2个）==========

    core_version():
      description: "获取 core 版本号"
      stability: stable
      parameters: []
      returns: Optional[str]  # 版本号字符串，未找到返回 None
      throws: []
      example: |
        ctx = ProjectContextManager()
        version = ctx.core_version()
        # "0.2.0"

    core_info():
      description: "获取 core meta 信息"
      stability: stable
      parameters: []
      returns: Optional[Dict[str, Any]]  # meta信息字典，未找到返回 None
      throws: []
      example: |
        ctx = ProjectContextManager()
        meta = ctx.core_info()
        # {"version": "0.2.0", "name": "new-tea-quant"}

    # ========== 缓存管理 API（1个）==========

    clear_userspace_cache():
      description: "清理 userspace 路径缓存"
      stability: stable
      parameters: []
      returns: None
      throws: []
      example: |
        ctx = ProjectContextManager()
        ctx.clear_userspace_cache()
        # 清理缓存后，下次调用 get_userspace_root 会重新计算