ConfigManager:
  layer: implementation
  description: "配置管理器 - 处理默认配置和用户配置的加载与合并"

  apis:
    load_with_defaults():
      description: "加载配置（用户配置覆盖默认配置）"
      stability: stable
      is_static: true
      parameters:
        - default_path: Path  # 默认配置文件路径
        - user_path: Path  # 用户配置文件路径（可选，如果不存在则只返回默认配置）
        - deep_merge_fields: Optional[Set[str]] = None  # 深度合并字段
        - override_fields: Optional[Set[str]] = None  # 覆盖合并字段
        - file_type: str = "json"  # 文件类型（json/py）
      returns: Dict[str, Any]  # 合并后的配置字典
      throws: []
      example: |
        settings = ConfigManager.load_with_defaults(
            default_path=Path("core/default_config/data.json"),
            user_path=Path("userspace/system/config/data.json")
        )

    load_json_file():
      description: "加载JSON配置文件"
      stability: stable
      is_static: true
      parameters:
        - path: Path  # JSON文件路径
      returns: Dict[str, Any]  # 文件不存在或加载失败返回空字典
      throws: []
      example: |
        config = ConfigManager.load_json_file(Path("data.json"))

    parse_python_config():
      description: "解析Python配置文件（涉及动态导入，是复杂解析）"
      stability: stable
      is_static: true
      parameters:
        - path: Path  # Python文件路径
        - var_name: str = "settings"  # 配置变量名
      returns: Dict[str, Any]  # 文件不存在或加载失败返回空字典
      throws: []
      example: |
        settings = ConfigManager.parse_python_config(
            Path("settings.py"),
            var_name="settings"
        )

    deep_merge_config():
      description: "合并默认配置与用户配置片段"
      stability: stable
      is_static: true
      parameters:
        - defaults: Dict[str, Any]  # 默认配置
        - custom: Dict[str, Any]  # 用户配置
        - deep_merge_fields: Optional[Set[str]] = None  # 深度合并字段
        - override_fields: Optional[Set[str]] = None  # 覆盖合并字段
      returns: Dict[str, Any]  # 合并后的配置字典
      throws: []
      example: |
        merged = ConfigManager.deep_merge_config(
            defaults={"level": "INFO"},
            custom={"level": "DEBUG"}
        )

    merge_mapping_configs():
      description: "合并名称到配置dict的映射"
      stability: stable
      is_static: true
      parameters:
        - defaults: Dict[str, Any]  # 默认配置映射
        - custom: Dict[str, Any]  # 用户配置映射
        - deep_merge_fields: Optional[Set[str]] = None
        - override_fields: Optional[Set[str]] = None
      returns: Dict[str, Any]  # 合并后的配置映射
      throws: []
      example: |
        merged = ConfigManager.merge_mapping_configs(
            defaults={"source1": {"enabled": true}},
            custom={"source1": {"refresh_days": 7}}
        )

    load_core_config():
      description: "加载core配置（合并default_config和userspace/config）"
      stability: stable
      is_static: true
      parameters:
        - config_name: str  # 配置名称（如logging、worker）
        - deep_merge_fields: Optional[Set[str]] = None
        - override_fields: Optional[Set[str]] = None
      returns: Dict[str, Any]  # 合并后的配置字典
      throws: []
      example: |
        config = ConfigManager.load_core_config("logging")

    load_database_config():
      description: "加载数据库配置（支持环境变量覆盖）"
      stability: stable
      is_static: true
      parameters:
        - database_type: str = None  # 数据库类型（postgresql/mysql）
      returns: Dict[str, Any]  # 数据库配置字典
      throws: []
      environment_dependencies:
        - DB_HOST
        - DB_PORT
        - DB_USER
        - DB_PASSWORD
      example: |
        db_config = ConfigManager.load_database_config()

    load_data_config():
      description: "加载data.json配置"
      stability: stable
      is_static: true
      parameters: []
      returns: Dict[str, Any]  # data配置字典
      throws: []
      example: |
        data_config = ConfigManager.load_data_config()

