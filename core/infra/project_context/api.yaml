# API Contract - infra.project_context
# Version: 0.4.0
# Last Updated: 2026-06-26
#
# 目的：
#   - 为所有API建立快捷目录
#   - 让开发者和自动测试一目了然
#   - 用户知道有哪些API和怎么用
#   - 测试知道有哪些对外接口和用法，快速覆盖

---

PathManager:
  layer: implementation
  description: "路径管理器 - 提供项目常用路径的快捷访问"

  apis:
    # Extensions module helper
    get_extensions_module():
      description: "拼接 extensions 包下模块路径"
      stability: stable
      is_static: true
      parameters:
        - *parts: str  # 路径片段（如 'data_source', 'handlers'）
      returns: str  # 模块路径（如 'userspace.extensions.data_source.handlers')
      throws: []
      example: |
        module_path = PathManager.get_extensions_module("data_source", "handlers")
        # "userspace.extensions.data_source.handlers"

    # 核心路径 API
    get_project_root():
      description: "获取项目根目录的绝对路径（通过.git、pyproject.toml等标记定位）"
      stability: stable
      is_static: true
      parameters: []
      returns: Path  # 项目根目录路径（绝对路径）
      throws: []
      example: |
        root = PathManager.get_project_root()
        # /path/to/new-tea-quant

    get_core_root():
      description: "获取core目录的绝对路径"
      stability: stable
      is_static: true
      parameters: []
      returns: Path  # core目录路径（绝对路径）
      throws: []
      example: |
        core_dir = PathManager.get_core_root()
        # /path/to/new-tea-quant/core

    get_userspace_root():
      description: "获取userspace目录的绝对路径（支持环境变量覆盖）"
      stability: stable
      is_static: true
      parameters: []
      returns: Path  # userspace目录路径（绝对路径）
      throws: []
      environment_dependencies:
        - NEW_TEA_QUANT_USERSPACE_ROOT  # 最高优先级
        - NTQ_USERSPACE_ROOT  # 次优先级
      example: |
        userspace = PathManager.get_userspace_root()
        # /path/to/userspace

    clear_userspace_cache():
      description: "清理userspace路径缓存（当路径变化后强制重新计算）"
      stability: stable
      is_static: true
      parameters: []
      returns: None
      throws: []
      example: |
        # 当修改了环境变量或配置文件后，清理缓存
        PathManager.clear_userspace_cache()

    get_strategies_root():
      description: "获取策略根目录的绝对路径"
      stability: stable
      is_static: true
      parameters: []
      returns: Path  # strategies根目录路径：userspace/strategies/
