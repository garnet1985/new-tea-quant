      parameters: []
      returns: Dict[str, Dict[str, Any]]  # 配置名称到配置字典的映射
      throws: []
      example: |
        configs = DiscoveryManager.discover_core_configs()
        # {"logging": {...}, "worker": {...}}

    discover_strategies():
      description: "发现所有策略（扫描strategies目录）"
      stability: stable
      is_static: true
      parameters: []
      returns: List[str]  # 策略名称列表
      throws: []
      example: |
        strategies = DiscoveryManager.discover_strategies()
        # ["strategy1", "strategy2"]

    discover_tags():
      description: "发现所有Tag scenario（扫描tags目录）"
      stability: stable
      is_static: true
      parameters: []
      returns: List[str]  # Tag scenario名称列表
      throws: []
      example: |
        tags = DiscoveryManager.discover_tags()
        # ["tag1", "tag2"]

---

ProjectContextManager:
  layer: orchestration
  description: "项目上下文管理器 - 统一入口，组合各Manager"

  apis:
    # 路径相关（委托PathManager）
    get_project_root():
      description: "获取项目根目录"
      stability: stable
      parameters: []
      returns: Path
      throws: []
      example: |
        root = ctx.get_project_root()

    get_core_root():
      description: "获取core目录"
      stability: stable
      parameters: []
      returns: Path
      throws: []
      example: |
        core_dir = ctx.get_core_root()

    get_userspace_root():
      description: "获取userspace目录"
      stability: stable
      parameters: []
      returns: Path
      throws: []
      example: |
        userspace = ctx.get_userspace_root()

    clear_userspace_cache():
      description: "清理userspace路径缓存"
      stability: stable
      parameters: []
      returns: None
      throws: []
      example: |
        ctx.clear_userspace_cache()

    # 配置相关（委托ConfigManager）
    load_core_config():
      description: "加载core配置"
      stability: stable
      parameters:
        - config_name: str
      returns: Dict[str, Any]
      throws: []
      example: |
        config = ctx.load_core_config("logging")

    load_database_config():
      description: "加载数据库配置"
      stability: stable
      parameters:
        - database_type: str = None
      returns: Dict[str, Any]
      throws: []
      example: |
        db_config = ctx.load_database_config()

    # 发现相关（委托DiscoveryManager）
    discover_core_configs():
      description: "发现所有core配置"
      stability: stable
      parameters: []
      returns: Dict[str, Dict[str, Any]]
      throws: []
      example: |
        configs = ctx.discover_core_configs()

    discover_strategies():
      description: "发现所有策略"
      stability: stable
      parameters: []
      returns: List[str]
      throws: []
      example: |
        strategies = ctx.discover_strategies()

    discover_tags():
      description: "发现所有Tag scenario"
      stability: stable
      parameters: []
      returns: List[str]
      throws: []
      example: |
        tags = ctx.discover_tags()

    # 文件相关（委托FileManager）
    find_file():
      description: "查找单个文件"
      stability: stable
      parameters:
        - filename: str
        - search_dir: Path
      returns: Optional[Path]
      throws: []
      example: |
        path = ctx.find_file("settings.py", Path("userspace/strategies"))

    load_file_content():
      description: "加载文件内容"
      stability: stable
      parameters:
        - path: Path
      returns: Optional[str]
      throws: []
      example: |
        content = ctx.load_file_content(Path("settings.py"))

    # 其他工具方法
    core_version():
      description: "获取core版本号"
      stability: stable
      parameters: []
      returns: str  # 版本号（如 "0.3.1"）
      throws: []
      example: |
        version = ctx.core_version()  # "0.3.1"

    get_extensions_module():
      description: "拼接 extensions 包下模块路径"
      stability: stable
      parameters:
        - *parts: str
      returns: str
      throws: []
      example: |
        module_path = ctx.get_extensions_module("data_source", "handlers")