FileManager:
  layer: implementation
  description: "文件管理器 - 文件查找、读取、存在性检查等操作"

  apis:
    find_file():
      description: "查找单个文件（在指定目录下递归查找）"
      stability: stable
      is_static: true
      parameters:
        - filename: str  # 文件名（如 settings.py）
        - search_dir: Path  # 搜索起始目录
      returns: Optional[Path]  # 文件路径，如果找不到返回 None
      throws: []
      example: |
        path = FileManager.find_file("settings.py", Path("userspace/strategies"))

    find_files():
      description: "查找所有匹配的文件（在指定目录下递归查找）"
      stability: stable
      is_static: true
      parameters:
        - filename: str  # 文件名（如 settings.py）
        - search_dir: Path  # 搜索起始目录
      returns: List[Path]  # 文件路径列表，如果找不到返回空列表
      throws: []
      example: |
        paths = FileManager.find_files("settings.py", Path("userspace/strategies"))

    load_file_content():
      description: "加载文件内容"
      stability: stable
      is_static: true
      parameters:
        - path: Path  # 文件路径
        - encoding: str = "utf-8"  # 文件编码
      returns: Optional[str]  # 文件内容，如果文件不存在或读取失败返回 None
      throws: []
      example: |
        content = FileManager.load_file_content(Path("settings.py"))

    file_exists():
      description: "检查文件是否存在"
      stability: stable
      is_static: true
      parameters:
        - path: Path  # 文件路径
      returns: bool  # 文件存在返回 True，否则返回 False
      throws: []
      example: |
        exists = FileManager.file_exists(Path("settings.py"))

    dir_exists():
      description: "检查目录是否存在"
      stability: stable
      is_static: true
      parameters:
        - path: Path  # 目录路径
      returns: bool  # 目录存在返回 True，否则返回 False
      throws: []
      example: |
        exists = FileManager.dir_exists(Path("userspace/strategies"))

    ensure_dir():
      description: "确保目录存在（如果不存在则创建）"
      stability: stable
      is_static: true
      parameters:
        - path: Path  # 目录路径
      returns: Path  # 目录路径（确保存在）
      throws: []
      example: |
        dir_path = FileManager.ensure_dir(Path("userspace/strategies/new"))

