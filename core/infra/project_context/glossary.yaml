# NTQ Glossary - 统一术语表
# Version: 0.4.0
# Last Updated: 2026-06-26
#
# 目的：
#   - 统一模块间术语，避免混淆
#   - 作为准则，确保命名一致
#   - 便于新成员理解代码
#
# 使用原则：
#   - 所有代码、文档、注释必须遵循此术语表
#   - 优先使用"推荐术语"
#   - 避免"禁止术语"
#   - 如果发现新的术语冲突，请及时更新此表

---

# ========== 项目结构相关术语 ==========

project_root:
  description: "项目根目录"
  recommended_terms:
    - project_root
    - 项目根目录
  forbidden_terms:
    - project_root_path
    - root_dir
  example: |
    # 推荐
    project_root = ProjectContext.get_project_root()
    
    # 禁止
    project_root_path = ProjectContext.get_project_root()

core_root:
  description: "core目录（核心代码目录）"
  recommended_terms:
    - core_root
    - core目录
  forbidden_terms:
    - core_dir
    - core_path
  example: |
    # 推荐
    core_root = ProjectContext.get_core_root()
    
    # 禁止
    core_dir = ProjectContext.get_core_root()

userspace_root:
  description: "userspace目录（用户自定义空间）"
  recommended_terms:
    - userspace_root
    - userspace目录
    - 用户空间
  forbidden_terms:
    - userspace_dir
    - userspace_path
    - user_root
  example: |
    # 推荐
    userspace_root = ProjectContext.get_userspace_root()
    
    # 禁止
    userspace_dir = ProjectContext.get_userspace_root()

strategy:
  description: "策略（用户定义的交易策略）"
  recommended_terms:
    - strategy
    - 策略
    - strategy_name
  forbidden_terms:
    - strat
    - algo
    - algorithm
  example: |
    # 推荐
    strategy_name = "example"
    strategy_dir = ProjectContext.get_strategy_directory(strategy_name)
    
    # 禁止
    strat = "example"
    algo_dir = ProjectContext.get_strategy_directory(strat)

tag:
  description: "Tag scenario（用户定义的Tag场景）"
  recommended_terms:
    - tag
    - tag_scenario
    - Tag场景
  forbidden_terms:
    - tag_name
    - scenario
    - tag_dir
  example: |
    # 推荐
    tag_scenario = "backtest"
    tag_dir = ProjectContext.get_tag_directory(tag_scenario)
    
    # 禁止
    tag_name = "backtest"
    scenario_dir = ProjectContext.get_tag_directory(tag_name)

# ========== 配置相关术语 ==========

config:
  description: "配置（配置文件或配置字典）"
  recommended_terms:
    - config
    - 配置
    - config_name
    - config_dict
  forbidden_terms:
    - configuration
    - settings
    - conf
  example: |
    # 推荐
    config = ProjectContext.load_core_config("logging")
    
    # 禁止
    configuration = ProjectContext.load_core_config("logging")

logging_config:
  description: "logging配置"
  recommended_terms:
    - logging_config
    - logging配置
  forbidden_terms:
    - log_config
    - logger_config
  example: |
    # 推荐
    logging_config = ProjectContext.load_core_config("logging")
    
    # 禁止
    log_config = ProjectContext.load_core_config("logging")

database_config:
  description: "数据库配置"
  recommended_terms:
    - database_config
    - 数据库配置
    - db_config
  forbidden_terms:
    - db_settings
    - database_settings
  example: |
    # 推荐
    database_config = ProjectContext.load_database_config()
    
    # 禁止
    db_settings = ProjectContext.load_database_config()

# ========== API相关术语 ==========

api:
  description: "API（对外接口）"
  recommended_terms:
    - API
    - api
    - 对外接口
  forbidden_terms:
    - interface
    - method
    - function
  example: |
    # 推荐
    # API文档
    # api.yaml
    
    # 禁止
    # Interface文档

facade:
  description: "Facade模式（对外唯一入口）"
  recommended_terms:
    - facade
    - Facade模式
    - 单一入口
  forbidden_terms:
    - facade_pattern
    - entry_point
  example: |
    # 推荐
    # Facade模式
    
    # 禁止
    # facade_pattern

# ========== Manager相关术语 ==========

manager:
  description: "Manager（管理器）"
  recommended_terms:
    - Manager
    - 管理器
    - xxxManager
  forbidden_terms:
    - xxxHelper
    - xxxService
    - xxxController
  example: |
    # 推荐
    ProjectContext  # Facade Manager
    PathManager     # 内部Manager
    ConfigManager   # 内部Manager
    
    # 禁止
    ProjectContextHelper
    PathService
    ConfigController

# ========== 方法命名相关术语 ==========

get:
  description: "get方法（获取数据，不改变状态）"
  recommended_terms:
    - get_xxx
    - 获取xxx
  forbidden_terms:
    - fetch_xxx
    - retrieve_xxx
    - obtain_xxx
  example: |
    # 推荐
    get_project_root()
    get_core_root()
    
    # 禁止
    fetch_project_root()
    retrieve_core_root()

load:
  description: "load方法（从文件或数据库加载）"
  recommended_terms:
    - load_xxx
    - 加载xxx
  forbidden_terms:
    - read_xxx
    - import_xxx
  example: |
    # 推荐
    load_core_config()
    load_file_content()
    
    # 禁止
    read_core_config()
    import_file_content()

discover:
  description: "discover方法（发现或扫描）"
  recommended_terms:
    - discover_xxx
    - 发现xxx
  forbidden_terms:
    - scan_xxx
    - find_xxx
    - search_xxx
  example: |
    # 推荐
    discover_strategies()
    discover_tags()
    
    # 禁止
    scan_strategies()
    find_tags()

find:
  description: "find方法（查找特定文件或对象）"
  recommended_terms:
    - find_xxx
    - 查找xxx
  forbidden_terms:
    - search_xxx
    - locate_xxx
  example: |
    # 推荐
    find_file()
    
    # 禁止
    search_file()
    locate_file()

parse:
  description: "parse方法（解析复杂格式数据）"
  recommended_terms:
    - parse_xxx
    - 解析xxx
  forbidden_terms:
    - decode_xxx
    - deserialize_xxx
  example: |
    # 推荐
    parse_python_config()
    
    # 禁止
    decode_python_config()

validate:
  description: "validate方法（验证数据或逻辑）"
  recommended_terms:
    - validate_xxx
    - 验证xxx
  forbidden_terms:
    - check_xxx
    - verify_xxx
  example: |
    # 推荐
    validate_settings()
    
    # 禁止
    check_settings()
    verify_settings()

clear:
  description: "clear方法（清理或删除）"
  recommended_terms:
    - clear_xxx
    - 清理xxx
  forbidden_terms:
    - reset_xxx
    - invalidate_xxx
    - delete_xxx
  example: |
    # 推荐
    clear_userspace_cache()
    
    # 禁止
    reset_userspace_cache()
    invalidate_userspace_cache()
    delete_userspace_cache()

# ========== 版本相关术语 ==========

version:
  description: "版本号"
  recommended_terms:
    - version
    - 版本号
    - v0.4.0
  forbidden_terms:
    - ver
    - v
    - release
  example: |
    # 推荐
    version: 0.4.0
    
    # 禁止
    ver: 0.4.0

# ========== 文件相关术语 ==========

file:
  description: "文件"
  recommended_terms:
    - file
    - 文件
    - filename
    - file_path
  forbidden_terms:
    - doc
    - document
  example: |
    # 推荐
    filename = "settings.py"
    file_path = Path("/path/to/file")
    
    # 禁止
    doc_name = "settings.py"

directory:
  description: "目录"
  recommended_terms:
    - directory
    - 目录
    - dir
    - directory_path
  forbidden_terms:
    - folder
    - path
  example: |
    # 推荐
    strategy_directory = ProjectContext.get_strategy_directory("example")
    
    # 禁止
    strategy_folder = ProjectContext.get_strategy_directory("example")

# ========== 注意事项 ==========

notes:
  - "所有新代码必须遵循此术语表"
  - "重构旧代码时，逐步更新术语"
  - "如果发现术语冲突，请及时更新此表"
  - "术语表应定期review和更新"
  - "优先使用英文术语，中文术语用于注释和文档"