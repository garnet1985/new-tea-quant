# glossary — infra.project_context
# Version: 0.5.0

project_root:
  description: "项目根目录"
  recommended_terms: [project_root, 项目根目录]
  forbidden_terms: [project_root_path, root_dir]
  example: |
    project_root = ProjectContext.path.get_project_root()

core_root:
  description: "core 目录"
  recommended_terms: [core_root, core目录]
  forbidden_terms: [core_dir, core_path]
  example: |
    core_root = ProjectContext.path.get_core_root()

userspace_root:
  description: "userspace 目录（可用环境变量覆盖）"
  recommended_terms: [userspace_root, userspace目录, 用户空间]
  forbidden_terms: [userspace_dir, user_root]
  example: |
    userspace_root = ProjectContext.path.get_userspace_root()

facade:
  description: "对外唯一入口 ProjectContext"
  recommended_terms: [facade, Facade, ProjectContext]
  forbidden_terms: [ProjectContextManager, PathManager]
  example: |
    from core.infra.project_context import ProjectContext

overridable_config:
  description: "core 默认 + userspace 覆盖的可合并配置"
  recommended_terms: [overridable_config, 可覆盖配置]
  forbidden_terms: []
  example: |
    ProjectContext.discovery.load_overridable_config("markets", "china_a_stock")
