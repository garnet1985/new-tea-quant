name: infra.project_context
version: 0.2.2
compatible_core_versions: ">=0.5.0"
package: core.infra
description: "项目上下文模块：提供常用路径，配置，缓存，项目上下文信息的模块。"
# 站点文档（可选；Drupal title / display title）
site_title: "工程上下文 (Project Context)"
site_display_title: "提供统一便捷的工程上下文 - Project Context 模块"
dependencies: []
changelog:
  - version: "0.2.2"
    changes:
      - path：移除 get_ai_* 兼容别名，统一 llm_providers 正式 API
      - ARCHITECTURE：补充 contracts / 配置发现 Mermaid
  - version: "0.2.1"
    changes:
      - path：get_install_demo_package_directory（userspace/.ntq/packages/install_demo）
  - version: "0.2.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 修改了暴露的API参数，函数，防止外部模块直接调用包内非公开接口
      - 正式版本之前所有API标注beta状态
      - Facade + namespace（path / config / meta / cache / discovery）
      - 内部 Manager 不对外暴露；调用方改为 ProjectContext.*
      - path：series_relation 扩展目录（root / directory / settings / results）
  - version: "0.1.3"
    changes:
      - 新增 as_of_latest_completed_trading_date 和 use_sample_stock_list 配置
      - 更改 decimal_places 配置结构
  - version: "0.1.2"
    changes:
      - userspace 目录重组与 PathManager 引用更新
      - ConfigManager 统一 default_config / userspace/config 合并（含 worker.json）
  - version: "0.1.1"
    changes:
      - 职责边界收紧：路径发现与配置加载与业务模块解耦
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
      - 提供项目根路径、userspace 与配置目录、文件查找与默认/用户配置合并的API，方便外部调用
