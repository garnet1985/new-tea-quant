# Setup 术语表
# Version: 0.2.0
# Compatible-Core: >=0.5.0
#
# 目的：解释本模块代码 / API 中出现的英文概念（是什么、为何存在、代码对应、关键对比）。
# aliases / avoid 只做命名纪律，不能代替解释。
# 本模块是「首次装好能跑」的编排；不是 setuptools；升级见 infra.updater。

terms:
  Setup:
    definition: |
      NTQ 安装域 Facade：环境路径/venv、按 profile 跑安装流水线、产物打包、完成态标记、
      安装期 trace。挂载 env / runtime / artifacts / meta / trace / types。
      CLI / launcher / BFF 只调本门面；不要跨模块 deep-import NewTeaQuantSetup /
      InstallOrchestrator（内部实现，步骤脚本可引用）。
    in_code: "from core.infra.setup import Setup"
    aliases: []
    avoid:
      - "跨模块直接 import NewTeaQuantSetup / InstallOrchestrator 当公开 API"
      - "把本模块当成 Python setuptools 打包"

  InstallOrchestrator:
    definition: |
      安装外层编排实现：集中调度 CLI / UI / session 安装路径，落在 core/orchestrator/。
      产品代码经 Setup.runtime 等入口间接触达；不要当作包根公开 API。
    in_code: "core/orchestrator/InstallOrchestrator（内部）"
    aliases: []
    avoid:
      - "from core.infra.setup import InstallOrchestrator"

  install_profile:
    definition: |
      安装画像：cli 或 ui。needs_install / mark_* 按 profile 读写完成态与指纹，
      使「装 CLI 运行时」与「装 UI 向导」可区分又共享同一套步骤资产。
    in_code: "InstallProfileName；Setup.runtime.needs_install / mark_*"
    aliases:
      - "InstallProfileName"
      - "cli / ui profile"
    avoid: []

  steps:
    definition: |
      core/infra/setup/core/steps/ 下的安装步骤包：sys_req_check、resolve_deps、
      init_userspace、db_connection、import_data 等。每步有自己的 install 逻辑与资产；
      编排器按序调用。不要把步骤脚本塞进 cli 模块。
    in_code: "core/infra/setup/core/steps/<step>/…"
    aliases:
      - "安装步骤"
    avoid:
      - "把步骤脚本放到 cli 模块"

  artifacts:
    definition: |
      安装产物工厂命名空间：打包 init userspace zip、导出演示数据包等，供安装步骤或
      发布流程使用。打包逻辑集中在 Setup.artifacts，不要在 CLI handler 里再实现一遍。
    in_code: "Setup.artifacts.*"
    aliases:
      - "Setup.artifacts"
    avoid:
      - "在 CLI 内实现打包逻辑"

  setup_runtime:
    definition: |
      安装向导会话/完成态文件 .ntq/setup-runtime.json。其中 isReady 是 CLI install.py 与
      UI 向导共用的「装好了」事实来源（pipeline_ready 读它）。两边写同一份，避免
      CLI 只写 install-state、UI 另写一份互不相通。
    in_code: "Setup.runtime.pipeline_ready / mark_cli_ready；.ntq/setup-runtime.json"
    aliases:
      - "setup-runtime.json"
      - "pipeline_ready"
      - "isReady"
    avoid:
      - "CLI 只写 install-state.json、UI 另写一份互不相通的进度"

  Setup.env:
    definition: |
      安装期环境命名空间：repo_root、venv 检测/创建、sys.path、requirements 路径等。
      保证步骤跑在项目 venv 与正确工作目录上。
    in_code: "Setup.env.repo_root / ensure_venv / ensure_sys_path / …"
    aliases:
      - "env"
    avoid: []
