# System Actions 术语表
# Version: 0.2.0

terms:
  NTQ:
    definition: "New Tea Quant 的简称。"
    aliases:
      - "New Tea Quant"
    avoid: []

  Facade:
    definition: "门面：对外统一入口类。本模块门面类是 SystemActions。"
    aliases:
      - "门面"
    avoid:
      - "deep-import cache_cleanup / shortcuts 当公开 API"

  SystemActions:
    definition: "本模块门面类；挂载 cache / pipeline / scaffold / types。"
    aliases: []
    avoid: []

  namespace:
    definition: "门面下的命名空间（cache / pipeline / scaffold / types）。"
    aliases:
      - "SystemActions.cache"
      - "SystemActions.pipeline"
      - "SystemActions.scaffold"
      - "SystemActions.types"
    avoid: []

  pipeline_lease:
    definition: "全局长任务租约；落盘 userspace/.ntq/runtime/pipeline_active.json。"
    aliases:
      - "PipelineLease"
      - "租约"
      - "SystemActions.pipeline.lease"
    avoid:
      - "lock_file"

  PipelineLeaseBusyError:
    definition: "acquire 失败：已有任务持有全局 pipeline 租约。"
    aliases: []
    avoid: []

  VALID_KINDS:
    definition: "合法 pipeline kind 集合：tag_run / strategy_scan / strategy_run / data_renew。"
    aliases:
      - "Kind"
    avoid: []

  cache_cleanup:
    definition: "清理 workbench DB 缓存 / 模拟与扫描产物 / userspace .ntq。"
    aliases:
      - "SystemActions.cache"
      - "CacheCleanup"
    avoid: []

  clear_strategy_results:
    definition: "删除策略整棵 results/（含 simulations + scan）；细粒度用 clear_backtest_results / clear_scan_results。"
    aliases: []
    avoid: []

  scaffold:
    definition: "从 _template 复制新建策略或 Tag。"
    aliases:
      - "SystemActions.scaffold"
      - "ScaffoldResult"
      - "ScaffoldError"
    avoid:
      - "create_new（包路径仅内部）"
