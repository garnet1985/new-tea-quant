name: infra.task_guard
version: "0.2.0"
compatible_core_versions: ">=0.5.0"
package: core.infra
description: "长任务互斥守卫：忙闲查询与全局单任务租约（非 job queue / pipeline 调度）。"
# 站点文档（可选；Drupal title / display title）
site_title: "任务守护模块 (Task Guard)"
site_display_title: "守护长任务 - Task Guard 模块"
dependencies:
  - infra.project_context
changelog:
  - version: "0.2.0"
    changes:
      - 由 infra.system_actions 收窄并更名为 task_guard；门面 TaskGuard；实现 TaskLease
      - 去掉杂项系统操作语义；仅保留长任务互斥
  - version: "0.1.0"
    changes:
      - （历史）原 system_actions 初始化：缓存清理、租约、脚手架等
