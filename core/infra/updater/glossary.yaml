# Updater 术语表
# Version: 0.1.0

terms:
  NTQ:
    definition: "New Tea Quant 的简称。"
    aliases:
      - "New Tea Quant"
    avoid: []

  Facade:
    definition: "门面：对外统一入口类。本模块门面类是 Update。"
    aliases:
      - "门面"
    avoid:
      - "deep-import core.db / core.post_upgrade 当公开 API"

  Update:
    definition: "本模块门面类；挂载 data_scripts / post_upgrade / runtime / types。"
    aliases: []
    avoid: []

  data_script:
    definition: "迁移执行器按 action_id 调用的数据脚本；公开入口 Updater.data_scripts。"
    aliases:
      - "Updater.data_scripts"
      - "DataScriptRegistry"
    avoid:
      - "migration_hook"

  post_upgrade:
    definition: "镜像与 DB 迁移之后的收尾动作；公开入口 Updater.post_upgrade。"
    aliases:
      - "Updater.post_upgrade"
      - "PostUpgradeRegistry"
    avoid:
      - "after_update"

  updater:
    definition: "升级编排运行时拷贝，位于 userspace/system/updater；源码 core/infra/updater/core/orchestrator。"
    aliases:
      - "userspace/system/updater"
      - "orchestrator"
    avoid:
      - "setup/updater"
      - "从 core import pipeline 执行升级"
