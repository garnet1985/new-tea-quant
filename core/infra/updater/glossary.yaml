# Updater 术语表
# Version: 0.1.1
# Compatible-Core: >=0.5.0
#
# 目的：解释本模块代码 / API 中出现的英文概念（是什么、为何存在、代码对应、关键对比）。
# aliases / avoid 只做命名纪律，不能代替解释。
# 本模块是「已装环境原地升级」编排；安装见 infra.setup；不检查远端新版本、不做回滚。

terms:
  Updater:
    definition: |
      升级域 Facade：登记/执行迁移数据脚本、跑 post_upgrade 收尾、暴露 runtime 类型。
      挂载 data_scripts / post_upgrade / runtime / types。不要 deep-import core.db /
      core.post_upgrade 当公开 API；也不要从当前 core import 整条 upgrade.run 流水线
      （镜像后应跑 userspace 里的编排拷贝，避免版本漂移）。
    in_code: "from core.infra.updater import Updater"
    aliases:
      - "Update（旧口误，门面名是 Updater）"
    avoid:
      - "deep-import core.db / core.post_upgrade 当公开 API"
      - "Updater.upgrade.run() 从当前 core 直接跑镜像流水线"

  data_script:
    definition: |
      迁移执行器按 action_id 调用的数据脚本（改数据、补列值等，相对纯 DDL 迁移）。
      用 Updater.data_scripts.register 登记；plan_executor / 迁移流程按 id 取并 run。
      不要叫 migration_hook。
    in_code: "Updater.data_scripts.register / get / run；DataScriptRegistry"
    aliases:
      - "Updater.data_scripts"
      - "DataScriptRegistry"
    avoid:
      - "migration_hook"

  post_upgrade:
    definition: |
      镜像替换与 DB 迁移之后的收尾动作（清缓存、补文件、登记项等）。
      公开入口 Updater.post_upgrade；CLI 子进程常 python -m core.infra.updater.core.post_upgrade run。
      不要叫 after_update。
    in_code: "Updater.post_upgrade.run；PostUpgradeRegistry"
    aliases:
      - "Updater.post_upgrade"
      - "PostUpgradeRegistry"
    avoid:
      - "after_update"

  userspace updater:
    definition: |
      升级编排的运行时拷贝，位于 userspace/system/updater；源码在
      core/infra/updater/core/orchestrator。升级时跑这份拷贝，而不是 import 正在被替换的 core。
      不要放到 setup/updater，也不要从 core import pipeline 执行升级。
    in_code: "userspace/system/updater；orchestrator"
    aliases:
      - "orchestrator"
      - "userspace/system/updater"
    avoid:
      - "setup/updater"
      - "从 core import pipeline 执行升级"
