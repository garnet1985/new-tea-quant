name: infra.utils
version: 0.2.3
compatible_core_versions: ">=0.5.0"
package: core.infra
description: "工具函数模块：提供一些通用的业务无关的工具函数。例如日期处理，类型转换，CSV/归档 IO，确定性随机，Markdown 模版填充，本机区域判断，pip/npm 依赖源等等。"
# 站点文档（可选；Drupal title / display title）
site_title: "通用函数模块 (Utils)"
site_display_title: "通用函数工具箱 - Utils 模块"
dependencies: []
changelog:
  - version: "0.2.3"
    changes:
      - ARCHITECTURE / DECISIONS 对齐模块文档规范（职责边界、结构图、Mermaid）；删除 __test__/README 重复说明
  - version: "0.2.2"
    changes:
      - Utils.pkg 统一 pip / npm 依赖源：国内默认中科大（失败自动换清华/阿里云/官方），npm 用 npmmirror；USE_CHINA_MIRROR 可强制
  - version: "0.2.1"
    changes:
      - 增加 Utils.locale.is_china() / Utils.is_china()：按大陆时区地名 / zh_CN 判断，不用 UTC+8
  - version: "0.2.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 修改了暴露的API参数，函数，防止外部模块直接调用包内非公开接口
      - 正式版本之前所有API标注beta状态
      - 从 core/utils 迁入 core/infra/utils（无兼容层）
      - 导出 DateUtils、Utils、deterministic_unit_float；io.csv_io / io.file_io
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
