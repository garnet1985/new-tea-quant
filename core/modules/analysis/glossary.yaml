# Analysis 术语表
# Version: 0.1.0
# Compatible-Core: >=0.5.0
#
# 目的：解释本模块代码中会出现的英文概念。当前为骨架：词条先固定边界，方法未定时不假装已有术语。
# 策略战役归因编排在 modules.strategy.engines.analyzer；全市场因子研究属未建的 factor 模块。

terms:
  Analysis:
    definition: |
      回测完成后解释 inputs 与 outputs 关系的模块 Facade。当前为骨架，无行为 API。
      不要把 strategy 的 simulate 报告、price_factor 层、或未建的 factor 模块当成本模块。
    in_code: "from core.modules.analysis import Analysis（骨架）"
    aliases:
      - "分析模块"
    avoid:
      - "把 strategy 的 simulate report 当成归因"
      - "price_factor（策略第二层模拟，不是因子模型）"
      - "factor 模块（未建；全市场因子研究，与本模块分家）"

  input:
    definition: |
      一次策略 run 里进入决策或约束结果的东西（设置、信号现场量等）。如何认定仍待决。
      不是「因子」的同义词。
    in_code: "规划中的 inputs 概念；见 docs/DECISIONS 或 DESIGN 遗留讨论"
    aliases:
      - "inputs"
      - "输入"
    avoid:
      - "因子（factor）作为本模块同义词"

  output:
    definition: |
      一次策略 run 已落盘的结果（各层 report / CSV 等）。如何解释、是否分三层仍待决。
      不是 BacktestEngine 的 RunResult（那是调度成败汇总）。
    in_code: "规划中的 outputs；策略 results/ 产物"
    aliases:
      - "outputs"
      - "回测结果"
    avoid:
      - "把 BE 的 RunResult 当成金融结果"

  attribution:
    definition: |
      解释 outputs 与 inputs 关系的活动。本模块目标职责；具体方法仍待决。
      IC / 滚动回测 / 因子挖掘属 factor 议题；策略侧 sea/spa/soa 战役在 strategy.analyzer。
    in_code: "规划中的 attribution API"
    aliases:
      - "归因"
    avoid:
      - "IC / 滚动回测 / 因子挖掘（factor 模块议题）"
      - "与 Strategy.simulate 战役归因混为一个入口"
