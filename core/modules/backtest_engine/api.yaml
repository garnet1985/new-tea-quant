# API Contract - modules.backtest_engine
# Version: 0.2.0
# Last Updated: 2026-06-30
# Requires: core>=0.4.0

module: modules.backtest_engine
version: 0.2.0
requires: core>=0.4.0

---

BacktestEngine:
  layer: orchestrator
  description: "回测调度 Facade — timeline / sliced 两种执行模式"

  apis:
    run:
      description: "统一入口：按 mode 分发到 Timeline 或 Sliced"
      stability: stable
      binding: class
      parameters:
        - mode: str | BacktestEngine.Mode  # timeline | sliced
        - jobs: List[Dict]  # BacktestJob wire 列表
        - execute_fn: Callable  # (JobContext) -> dict
        - executor_key: str  # worker.json profile 键
        - run_name: str = ""
        - on_result: Optional[Callable] = None
        - data_mgr: Optional[Any] = None
        - log_label: str = "backtest"
      returns: BacktestEngine.RunResult
      throws:
        - ValueError: unknown mode 或 unknown executor_key
      example: |
        from core.modules.backtest_engine import BacktestEngine
        from core.modules.backtest_engine.contracts import JobContext

        def execute_fn(ctx: JobContext) -> dict:
            return {"success": True, "job_id": ctx.job_id}

        result = BacktestEngine.run(
            mode="timeline",
            jobs=[{"id": "000001.SZ", "payload": {"entity_id": "000001.SZ"}}],
            execute_fn=execute_fn,
            executor_key="tag",
        )

    Timeline.run:
      description: "Timeline 模式：probe → plan → batch → process pool"
      stability: stable
      binding: static
      parameters:
        - jobs: List[Dict]
        - execute_fn: Callable
        - executor_key: str
        - run_name: str = ""
        - on_result: Optional[Callable] = None
        - on_release: Optional[Callable] = None
        - data_mgr: Optional[Any] = None
        - log_label: str = "backtest"
      returns: BacktestEngine.RunResult
      throws:
        - ValueError: unknown executor_key
      example: |
        result = BacktestEngine.timeline.run(jobs, execute_fn, executor_key="tag")

    Sliced.run:
      description: "Sliced 模式：slice probe → plan → bulk job execute_fn"
      stability: stable
      binding: static
      parameters:
        - jobs: List[Dict]
        - execute_fn: Callable
        - executor_key: str
        - run_name: str = ""
        - on_result: Optional[Callable] = None
        - data_mgr: Optional[Any] = None
        - log_label: str = "backtest"
      returns: BacktestEngine.RunResult
      throws:
        - ValueError: unknown executor_key
      example: |
        result = BacktestEngine.sliced.run(jobs, execute_fn, executor_key="tag")

---

BacktestJob:
  layer: contracts
  description: "Job wire 契约（见 contracts.py）"

  apis:
    from_wire:
      description: "解析 {'id', 'payload'} wire dict"
      stability: stable
      binding: class
      parameters:
        - job: Dict[str, Any]
      returns: BacktestJob
      throws:
        - ValueError: 契约不符
      example: |
        from core.modules.backtest_engine.contracts import BacktestJob
        job = BacktestJob.from_wire({"id": "j1", "payload": {}})

    to_wire:
      description: "序列化为 wire dict"
      stability: stable
      binding: instance
      parameters: []
      returns: Dict[str, Any]
      throws: []
      example: |
        wire = BacktestJob(id="j1", payload={}).to_wire()

---

# binding 取值：static | class | instance
api_binding_levels:
  static:
    description: "@staticmethod 或类命名空间上的函数"
  class:
    description: "@classmethod"
  instance:
    description: "实例方法"

api_stability_levels:
  stable:
    description: "API 稳定"
    breaking_change_risk: low
  beta:
    description: "可能调整"
    breaking_change_risk: medium
  experimental:
    description: "实验性"
    breaking_change_risk: high
