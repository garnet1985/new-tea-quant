module: modules.backtest_engine
version: 0.3.0
requires: core>=0.4.0

# ---------------------------------------------------------------------------
# 用语
#
#   BacktestJob     — job dataclass（contracts.py）
#   job dict        — {'id': str, 'payload': dict}
#   performance     — 调度配置 dict；调用方传入，覆盖 engine default
#   task_name       — 本次 run 展示/追踪名 → JobContext
#   RunCallbacks    — 可选回调集合（on_result、on_release、…）
#
# 执行模式（本质：entity 是否在 slice 边界内发生编排交互）
#   entity_based  — 每 entity（或 entity batch）独立并行，slice 内无 cross-entity 编排
#   slice_based   — 按日历切片，slice 内多 entity 经 reader/compute 管道交互
#
# ---------------------------------------------------------------------------

# parameters 写法约定（全文件统一）
#
#   positional:        必须按顺序传递的前 N 个参数（可无默认值）
#   keyword_only:    仅允许关键字传递（Python 签名中 * 之后）
#   keyword:         可关键字传递的可选参数（含默认值；若与 positional 重叠以 positional 为准）
#
# 每个参数条目字段：
#   name, type, required, default, kind: positional | keyword_only | keyword

---

BacktestEngine:
  layer: orchestrator
  description: "回测调度 Facade — entity_based / slice_based 两种执行模式"

  apis:
    run:
      description: "统一入口：按 mode 分发到 entity_based 或 slice_based"
      stability: beta
      binding: class
      parameters:
        keyword:
          - name: mode
            type: str | BacktestEngine.Mode
            required: true
            notes: "entity_based | slice_based"
        positional:
          - name: jobs
            type: Sequence[BacktestJob | job dict]
            required: true
          - name: execute_fn
            type: Callable[[JobContext], dict]
            required: true
        keyword_only:
          - name: performance
            type: Optional[Dict[str, Any]]
            required: false
            default: null
            notes: "应用方 dispatch 配置；覆盖 engine base defaults，用户 settings 不可传入"
          - name: task_name
            type: str
            required: false
            default: '""'
          - name: callbacks
            type: Optional[RunCallbacks]
            required: false
            default: null
          - name: enable_progress_display
            type: bool
            required: false
            default: true
            notes: "是否在 CMD 输出 engine 进度；进度始终计算"
      returns: BacktestEngine.RunResult
      throws:
        - ValueError: unknown mode
        - ValueError: job dict 校验失败
      notes: |
        - 应用方在模块内维护 dispatch 配置（如 dispatch.yaml），run 前 merge engine base defaults 后传入 performance。
        - engine 不读取 global worker.json；用户 settings 不可传入调度参数。
        - 回调一律经 callbacks=RunCallbacks(...)，不单独暴露 on_* 参数。
        - enable_progress_display 仅控制 CMD 进度输出；进度始终计算。
        - plan / monitor_stats 经 RunResult 返回。
      example: |
        from core.modules.backtest_engine import BacktestEngine
        from core.modules.backtest_engine.contracts import (
            BacktestJob,
            JobContext,
            RunCallbacks,
        )

        def execute_fn(ctx: JobContext) -> dict:
            return {"success": True, "job_id": ctx.job_id}

        result = BacktestEngine.run(
            mode=BacktestEngine.Mode.ENTITY_BASED,
            jobs=[BacktestJob(id="000001.SZ", payload={"entity_id": "000001.SZ"}).to_dict()],
            execute_fn=execute_fn,
            performance=perf,
            task_name="tag:demo",
            callbacks=RunCallbacks(on_result=handle_result),
        )

    EntityBased.run:
      description: "entity_based：probe → plan → entity batch → process pool（entity 间无 slice 编排交互）"
      stability: beta
      binding: static
      parameters:
        positional:
          - name: jobs
            type: Sequence[BacktestJob | job dict]
            required: true
          - name: execute_fn
            type: Callable[[JobContext], dict]
            required: true
        keyword_only:
          - name: performance
            type: Optional[Dict[str, Any]]
            required: false
            default: null
            notes: "应用方 dispatch 配置；覆盖 engine base defaults，用户 settings 不可传入"
          - name: task_name
            type: str
            required: false
            default: '""'
          - name: callbacks
            type: Optional[RunCallbacks]
            required: false
            default: null
          - name: enable_progress_display
            type: bool
            required: false
            default: true
            notes: "是否在 CMD 输出 engine 进度；进度始终计算"
      returns: BacktestEngine.RunResult
      throws:
        - ValueError: job 校验失败
      notes: |
        RunCallbacks 可含 on_result、on_release（entity batch 释放时）。
      example: |
        result = BacktestEngine.entity_based.run(
            jobs,
            execute_fn,
            performance=perf,
            task_name="tag:demo",
            callbacks=RunCallbacks(on_result=handle_result, on_release=handle_release),
        )

    SliceBased.run:
      description: "slice_based：slice probe → plan → bulk job execute_fn（slice 内 reader/compute 管道）"
      stability: beta
      binding: static
      parameters:
        positional:
          - name: jobs
            type: Sequence[BacktestJob | job dict]
            required: true
          - name: execute_fn
            type: Callable[[JobContext], dict]
            required: true
        keyword_only:
          - name: performance
            type: Optional[Dict[str, Any]]
            required: false
            default: null
            notes: "应用方 dispatch 配置；覆盖 engine base defaults，用户 settings 不可传入"
          - name: task_name
            type: str
            required: false
            default: '""'
          - name: callbacks
            type: Optional[RunCallbacks]
            required: false
            default: null
          - name: enable_progress_display
            type: bool
            required: false
            default: true
            notes: "是否在 CMD 输出 engine 进度；进度始终计算"
      returns: BacktestEngine.RunResult
      throws:
        - ValueError: job 校验失败
      example: |
        result = BacktestEngine.slice_based.run(
            jobs,
            execute_fn,
            performance=perf,
            task_name="tag:calendar_slice",
            callbacks=RunCallbacks(on_result=handle_result),
        )

RunCallbacks:
  layer: contracts
  description: "单次 run 的可选回调集合（contracts.py）；避免 run() 参数随 on_* 增长"

  fields:
    on_result:
      type: Optional[Callable[[JobReport, RunProgress], None]]
      required: false
      default: null
      notes: "每个 job/batch 完成时（主进程）"
    on_release:
      type: Optional[Callable[[JobReport], None]]
      required: false
      default: null
      notes: "entity_based 专用：batch 资源释放时"
    # 预留：on_progress、on_pool_enter、on_pool_exit 等追加字段，不扩展 run() 签名

  example: |
    callbacks = RunCallbacks(
        on_result=lambda report, progress: ...,
        on_release=lambda report: ...,
    )

---

BacktestJob:
  layer: contracts
  description: "调度 job 契约：id + payload（见 contracts.py）"

  shape:
    id: str
    payload: dict

  apis:
    from_dict:
      description: "从 job dict 解析为 BacktestJob"
      stability: stable
      binding: class
      parameters:
        positional:
          - name: job
            type: Dict[str, Any]
            required: true
      returns: BacktestJob
      throws:
        - ValueError: 缺少 id 或 payload 非 dict
      example: |
        job = BacktestJob.from_dict({"id": "j1", "payload": {"entity_id": "000001.SZ"}})

    to_dict:
      description: "序列化为 job dict"
      stability: stable
      binding: instance
      parameters: {}
      returns: Dict[str, Any]
      example: |
        d = BacktestJob(id="j1", payload={}).to_dict()

    validate_many:
      description: "批量校验 job dict；plan 前 fail-fast"
      stability: stable
      binding: class
      parameters:
        positional:
          - name: jobs
            type: List[Dict[str, Any]]
            required: true
        keyword:
          - name: mode
            type: str | BacktestEngine.Mode
            required: true
            notes: "entity_based | slice_based，决定 payload 最小必需集"
      returns: None
      throws:
        - ValueError: 校验失败

---

JobValidation:
  layer: contracts
  description: "plan 前 fail-fast（payload 最小必需集）"

  rules:
    envelope:
      required: ["id", "payload"]
      payload_type: dict

    entity_based:
      description: "entity 独立并行；无 slice 内 cross-entity 编排"
      payload_required_one_of:
        - "单 entity 键（entity_id / stock_id 等）"
        - "jobs: List[job dict]（batch 路径）"

    slice_based:
      description: "日历切片 bulk；slice 内多 entity 经 orchestrator 交互"
      payload_required:
        - open_dates
        - entity_ids | stock_ids | 等价 bulk entity 键

---

JobContext:
  layer: contracts
  fields:
    job_id: str
    payload: dict
    task_name: str

---

api_binding_levels:
  static:
    description: "@staticmethod 或类命名空间上的函数"
  class:
    description: "@classmethod"
  instance:
    description: "实例方法"

api_stability_levels:
  stable:
    description: "API 稳定"
    breaking_change_risk: low
  beta:
    description: "契约已定，实现仍在迁移"
    breaking_change_risk: medium
  experimental:
    description: "实验性"
    breaking_change_risk: high

# ---------------------------------------------------------------------------
# 0.3.0 实现 checklist
#
#   Modes: entity_based / slice_based only
#   RunCallbacks dataclass；run 签名 jobs, execute_fn, *, performance, task_name, callbacks
#   BacktestJob.from_dict / to_dict
#   无 public: executor_key, log_label, data_mgr, run_name, timeline/sliced 别名
# ---------------------------------------------------------------------------
