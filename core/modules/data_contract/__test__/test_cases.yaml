### BaseDataContractLoader API

#### 4.1 BaseDataContractLoader.load
- 描述：加载单个 entity 数据（子类实现）
- 输入：params dict
- 输出：data
- 验证：返回数据结构正确

#### 4.2 BaseDataContractLoader.load_batch
- 描述：批量加载多个 entity
- 输入：entity_ids list, params dict
- 输出：dict[entity_id, data]
- 验证：每个 entity 返回对应数据

#### 4.3 BaseDataContractLoader.build_batch_load_params
- 描述：构建批量加载参数
- 输入：entity_id, params
- 输出：dict
- 验证：返回该 entity 的特定参数

