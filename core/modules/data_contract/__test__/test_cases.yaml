### BaseDataContract API

#### 2.1 BaseDataContract.__init__
- 描述：初始化 contract
- 输入：declaration dict
- 输出：BaseDataContract 实例
- 验证：meta/runtime/specific 正确初始化

#### 2.2 BaseDataContract.fill_in_data
- 描述：填充数据
- 输入：runtime dict
- 输出：self（链式调用）
- 验证：is_loaded=true，data 有值

#### 2.3 BaseDataContract.add_runtime
- 描述：添加 runtime（链式）
- 输入：runtime dict
- 输出：self
- 验证：runtime 字段正确设置

#### 2.4 BaseDataContract.is_global
- 描述：检查 scope
- 输入：无
- 输出：bool
- 验证：global scope 返回 True

#### 2.5 BaseDataContract.is_per_entity
- 描述：检查 scope
- 输入：无
- 输出：bool
- 验证：per_entity scope 返回 True

#### 2.6 BaseDataContract.is_time_series
- 描述：检查 type
- 输入：无
- 输出：bool
- 验证：time_series type 返回 True

#### 2.7 BaseDataContract.get_entity_ids
- 描述：获取 entity IDs
- 输入：无
- 输出：list[str]
- 验证：返回 runtime.entity_ids

#### 2.8 BaseDataContract.get_entity_data
- 描述：获取单个 entity 数据
- 输入：entity_id
- 输出：data
- 验证：per_entity scope 返回对应 entity 数据

#### 2.9 BaseDataContract.get_entities_data
- 描述：获取所有 entity 数据
- 输入：无
- 输出：dict[entity_id, data]
- 验证：per_entity scope 返回 dict

