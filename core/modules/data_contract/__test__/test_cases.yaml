### BaseTimeSeriesContract API

#### 3.1 BaseTimeSeriesContract.get_time_window
- 描述：获取时间窗口
- 输入：无
- 输出：TimeRange 或 None
- 验证：返回 start/end

#### 3.2 BaseTimeSeriesContract.get_base_time_field
- 描述：获取时间字段名
- 输入：无
- 输出：str
- 验证：返回 "date" 或 specific.time_axis_field

#### 3.3 BaseTimeSeriesContract.get_time_format
- 描述：获取时间格式
- 输入：无
- 输出：str
- 验证：返回 "YYYYMMDD" 或 specific.time_axis_format

#### 3.4 BaseTimeSeriesContract.normalize_as_of
- 描述：规范化时间
- 输入：各种格式（"20200101", "2020-01-01", "2020Q1"）
- 输出：YYYYMMDD
- 验证：统一转换为 YYYYMMDD

#### 3.5 BaseTimeSeriesContract.until
- 描述：获取 PIT 累计数据（推进 cursor）
- 输入：as_of
- 输出：dict[entity_id, PIT data]
- 验证：返回累计数据，cursor 推进

#### 3.6 BaseTimeSeriesContract.reset_cursor
- 描述：重置 cursor 状态
- 输入：无
- 输出：None
- 验证：cursor=-1, acc=[]

#### 3.7 BaseTimeSeriesContract.fill_in_data（扩展）
- 描述：填充数据并初始化 cursor
- 输入：runtime dict
- 输出：self
- 验证：is_loaded=true, _cursor_states 初始化

