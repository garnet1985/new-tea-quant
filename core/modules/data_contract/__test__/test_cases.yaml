## 测试覆盖率目标

- API 契约测试：100% api.yaml 定义的 API
- 功能测试：覆盖所有核心场景
- 错误处理：覆盖所有异常路径

---

## 测试执行策略

1. Layer 1 测试：每次提交必跑（快速反馈）
2. Layer 2 测试：CI/CD pipeline 必跑（完整验证）
3. Mock 数据：不依赖真实数据库（可独立运行）
4. 环境变量：NTQ_TESTS_ENABLED=1 启用完整测试