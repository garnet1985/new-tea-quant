## Layer 2: 功能测试用例

### 场景 1: 初始化错误检查

#### 1.1 declaration 缺少必要字段
- 输入：declaration 缺少 meta.key
- 预期：抛出 ValueError（"meta.key 不能为空"）
- 验证点：入口把关验证

#### 1.2 declaration loader 未继承基类
- 输入：loader 不是 BaseDataContractLoader 子类
- 预期：抛出 ValueError
- 验证点：继承关系检查

#### 1.3 runtime 参数缺失（per_entity）
- 输入：per_entity contract 未提供 entity_ids
- 预期：抛出 ValueError（"必须包含 entity_ids"）
- 验证点：runtime 验证

#### 1.4 contract_type 无效
- 输入：meta.type = "invalid_type"
- 预期：抛出 ValueError
- 验证点：type 验证

#### 1.5 contract_scope 无效
- 输入：meta.scope = "invalid_scope"
- 预期：抛出 ValueError
- 验证点：scope 验证

---

### 场景 2: until 推进正确性

#### 2.1 单 entity 累进扫描
- 数据：entity_1 = [{"date": "20200101"}, {"date": "20200201"}, {"date": "20200301"}]
- 操作：
  - until("20200101") → 1 条数据，cursor=0
  - until("20200201") → 2 条数据，cursor=1
  - until("20200301") → 3 条数据，cursor=2
- 验证：累进扫描，不重复扫描

#### 2.2 多 entity 独立 cursor
- 数据：
  - entity_1 = [{"date": "20200101"}, {"date": "20200201"}]
  - entity_2 = [{"date": "20200115"}, {"date": "20200215"}]
- 操作：
  - until("20200101") → entity_1: 1 条, entity_2: 1 条
  - until("20200201") → entity_1: 2 条, entity_2: 1 条（因为 entity_2 的第二条是 20200215）
- 验证：每个 entity 独立 cursor

#### 2.3 reset_cursor 后重新扫描
- 数据：entity_1 = [{"date": "20200101"}, {"date": "20200201"}]
- 操作：
  - until("20200201") → 2 条，cursor=1
  - reset_cursor() → cursor=-1, acc=[]
  - until("20200101") → 1 条，cursor=0（从头扫描）
- 验证：重置后从头开始

#### 2.4 时间格式转换
- 输入：
  - "20200101" → "20200101"
  - "2020-01-01" → "20200101"
  - "2020Q1" → "20200101"（季度首日）
- 验证：统一转换为 YYYYMMDD

#### 2.5 global scope PIT 数据
- 数据：global = [{"date": "20200101"}, {"date": "20200201"}]
- 操作：until("20200101") → {"_global": [1 条]}
- 验证：global scope 使用 "_global" key

---

### 场景 3: 内存释放验证

#### 3.1 contract 销毁后内存释放
- 操作：
  - contract = issuer.get_contract(...)
  - contract.fill_in_data(...)
  - pit_data = contract.until(...)
  - del contract
- 验证：内存占用减少（cursor 状态释放）

#### 3.2 reset_cursor 释放 acc
- 操作：
  - until(...) → acc 有数据
  - reset_cursor() → acc=[]
- 验证：acc 列表清空（内存释放）

#### 3.3 acc 是引用（不复制数据）
- 操作：
  - until("20200101")
  - 修改 contract.data[0]["price"] = 100
  - acc[0]["price"] 也变为 100
- 验证：acc 是引用，共享数据

---

### 场景 4: fill_in_data 加载逻辑

#### 4.1 单 entity 加载（load）
- 输入：entity_ids=["600000.SH"]
- 验证：调用 loader.load()，返回 dict[entity_id: data]

#### 4.2 多 entity 加载（load_batch）
- 输入：entity_ids=["600000.SH", "600001.SH"]
- 验证：调用 loader.load_batch()，返回 dict

#### 4.3 fingerprint 缓存验证
- 操作：
  - fill_in_data(runtime={...})
  - 再次 fill_in_data(runtime={...})（相同 runtime）
- 验证：第二次不触发 loader IO（使用 cache）

#### 4.4 fingerprint 变化触发重新加载
- 操作：
  - fill_in_data(runtime={...})
  - 修改 runtime.entity_ids
  - fill_in_data()
- 验证：触发重新加载（fingerprint 变化）

---

### 场景 5: 错误处理

#### 5.1 未加载时调用 until
- 操作：contract.until(...)（未 fill_in_data）
- 预期：抛出 ValueError（"Contract 未加载"）

#### 5.2 不存在的 key
- 操作：issuer.get_contract("nonexistent.key")
- 预期：抛出 KeyError

#### 5.3 loader 加载失败
- 操作：loader.load() 返回错误
- 预期：抛出 RuntimeError

---

### 场景 6: 数据结构验证

#### 6.1 global scope 数据结构
- 输入：global scope contract
- 验证：contract.data 是单一数据结构（list 或 DataFrame）

#### 6.2 per_entity scope 数据结构
- 输入：per_entity contract
- 验证：contract.data 是 dict[entity_id: data]

#### 6.3 cursor 状态结构
- 验证：
  - global: {"_global": CursorState}
  - per_entity: {entity_id: CursorState}

---

### 场景 7: 重复 declaration 检测

#### 7.1 系统 declaration 重复
- 操作：两个系统 contract 使用相同 key
- 预期：抛出 ValueError（"key 已存在，不能重复声明"）

#### 7.2 用户 declaration 覆盖系统
- 操作：用户 declaration 使用系统 key
- 预期：抛出 ValueError（不允许覆盖）

---

## 测试数据准备

### Mock 数据结构

```python
# Global scope mock data
MOCK_GLOBAL_DATA = [
    {"date": "20200101", "value": 100},
    {"date": "20200201", "value": 110},
    {"date": "20200301", "value": 120},
]

# Per entity mock data
MOCK_ENTITY_DATA = {
    "600000.SH": [
        {"date": "20200101", "close": 10.0},
        {"date": "20200201", "close": 11.0},
        {"date": "20200301", "close": 12.0},
    ],
    "600001.SH": [
        {"date": "20200115", "close": 20.0},
        {"date": "20200215", "close": 21.0},
        {"date": "20200315", "close": 22.0},
    ],
}
```

### Mock Loader

```python
class MockLoader(BaseDataContractLoader):
    def load(self, params):
        entity_id = params["entity_id"]
        return MOCK_ENTITY_DATA.get(entity_id, [])

    def load_batch(self, entity_ids, params):
        return {eid: MOCK_ENTITY_DATA.get(eid, []) for eid in entity_ids}
```

