# Data Contract 测试用例文档

## 测试分层

### Layer 1: API 契约测试（test_api.py）
- 目标：覆盖 api.yaml 定义的所有公开 API
- 目的：及时发现 API 变动，防止破坏性变更
- 覆盖率：100% API 定义

### Layer 2: 功能测试（test_functional.py）
- 目标：验证核心功能逻辑正确性
- 场景：初始化、until 推进、内存释放、错误处理
- 数据：使用 mock 数据（不依赖真实数据库）

---

## Layer 1: API 契约测试用例

### ContractIssuer API

#### 1.1 ContractIssuer.__init__
- 描述：初始化 ContractIssuer
- 输入：无
- 输出：ContractIssuer 实例
- 验证：实例创建成功，内部状态为空

#### 1.2 ContractIssuer.discover
- 描述：发现系统 contract
- 输入：无（或 user_space_path）
- 输出：None
- 验证：发现 contract 数量 > 0，包含已知 key

#### 1.3 ContractIssuer.get_contract
- 描述：根据 key 获取 contract 实例
- 输入：key="stock.kline.daily"
- 输出：BaseTimeSeriesContract 实例
- 验证：类型正确，meta.key 匹配

#### 1.4 ContractIssuer.get_declaration
- 描述：获取原始 declaration
- 输入：key="stock.kline.daily"
- 输出：dict
- 验证：包含 meta/specific 字段

#### 1.5 ContractIssuer.list_available_keys
- 描述：列出所有可用 key
- 输入：无
- 输出：list[str]
- 验证：返回类型正确，包含已知 key

#### 1.6 ContractIssuer.list_system_keys
- 描述：列出系统 key
- 输入：无
- 输出：list[str]
- 验证：只包含系统 contract

#### 1.7 ContractIssuer.list_user_keys
- 描述：列出用户 key
- 输入：无
- 输出：list[str]
- 验证：只包含用户 contract（默认为空）

#### 1.8 ContractIssuer.is_customized
- 描述：检查 key 是否为用户自定义
- 输入：key="stock.kline.daily"
- 输出：bool
- 验证：系统 key 返回 False

#### 1.9 ContractIssuer.is_available
- 描述：检查 key 是否可用
- 输入：key="stock.kline.daily" 和 "nonexistent.key"
- 输出：bool
- 验证：存在返回 True，不存在返回 False

#### 1.10 ContractIssuer.register_custom_declaration
- 描述：注册自定义 declaration
- 输入：declaration dict
- 输出：None
- 验证：注册后 is_available=true，is_customized=true

#### 1.11 ContractIssuer.get_validation_errors
- 描述：获取验证错误
- 输入：无
- 输出：dict[str, list[str]]
- 验证：返回错误映射

