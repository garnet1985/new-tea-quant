# Data Contract 术语表
# Version: 0.5.0

terms:
  DataContract:
    definition: "一个数据契约，一个用来声明我需要什么数据的合约，里边包括了这个数据契约的基本属性。签发的时候可以是空契约，只有基本信息，只填充数据以后才能变成一个带有数据的契约。"
    aliases: []
    avoid: []

  DataKey:
    definition: "数据契约的唯一标识字符串，在外部模块使用的时候需要声明的唯一标识。注意，相同的数据契约，无论什么情况下data key都是一样的，但是issue过后的契约contract id会不同。"
    aliases: ["data key", "contract key", "key"]
    avoid: ["data contract id", "contract id", "数据契约id"]

  ContractId:
    definition: "数据契约发行以后的唯一标识字符串。一个相同的数据契约发行多次以后会产生不同的 contract id，但contract里的 data key 是不变的。"
    aliases: ["contract id", "数据契约id"]
    avoid: ["contract key", "data key", "数据契约key"]

  DataContractMeta:
    definition: "数据契约的基本信息存放的数据集"
    aliases: ["数据契约元数据"]
    avoid: []

  DataContractScope:
    definition: "数据契约的范围，分为全局(Global)和局部(PER_ENTITY)。具体见GLOBAL和PER_ENTITY定义。"
    aliases: ["签发"]
    avoid: []

  GLOBAL:
    definition: "全局数据契约，所有实体都共享。比如GDP数据。"
    aliases: ["全局数据"]
    avoid: ["局部数据"]

  PER_ENTITY:
    definition: "局部数据契约，每个实体都有自己的数据。比如公司财务数据。"
    aliases: ["局部数据"]
    avoid: ["全局数据"]

  Entity:
    definition: "实体，在当前模块中多指单个股票、公司等。"
    aliases: ["stock", "company"]
    avoid: []

  DataContractType:
    definition: "数据契约的种类，分为时序和非时序，详细请见TimeSeries和NonTimeSeries定义。"
    aliases: []
    avoid: []

  TimeSeries:
    definition: "时序，是指所有的数据是按照一个时间轴展现的。比如股票价格数据，GDP，CPI等等"
    aliases: ["时间序列"]
    avoid: []

  NonTimeSeries:
    definition: "非时序，是指一个没有时间概念的数据。比如市场分类（虽然也会随时间变化，但基本是不变的）"
    aliases: ["非时间序列"]
    avoid: []

  TimeWindow:
    definition: "时间窗口，就是时间范围，起始时间和结束时间以及他们中间的所有时间点。"
    aliases: ["时间范围"]
    avoid: []

  TimeWindowEdge:
    definition: "时间窗口的边缘，就是起始时间和结束时间。"
    aliases: ["起始时间", "结束时间"]
    avoid: []

  TimeAxisField:
    definition: "当前数据契约里的哪个字段用来作为主时间轴使用，举个例子，公司财务有披露起始时间和实际公布时间等多个时间字段，这里就是数据产生是按照哪个字段来展现的"
    aliases: ["时间轴字段"]
    avoid: []

  TimeAxisFormat:
    definition: "时间轴的时间格式，模块中默认时间格式为 YYYYMMDD。模块中指的是TimeAxisField的时间格式。"
    aliases: ["时间格式"]
    avoid: []

  NormalizedTimeAxis:
    definition: "统一的时间轴格式。把一些其他时间格式比如季度（YYYYQ1-4）转换为统一的时间格式 YYYYMMDD。"
    aliases: ["归一化时间轴"]
    avoid: []

  AsOfDate:
    definition: "当前暴露数据的时间截止点，比如我们是2023年全年的数据契约，data cursor指向2023年5月1日，那么这个5月1日就是游标位置，是回测当中用来按照时间点截取可见数据的重要参数"
    aliases: ["当前时间点", "时间位置"]
    avoid: []

  DataCursor:
    definition: "时间游标，是个记录当前数据契约流逝到时间窗口的什么位置的一个指针。模块中就是记录AsOfDate的时间点。"
    aliases: []
    avoid: []

  Fill_in_Data:
    definition: "对数据契约填充数据。"
    aliases: []
    avoid: []

  Until:
    definition: "让累积的数据推进到xx时间点的。"
    aliases: []
    avoid: []

