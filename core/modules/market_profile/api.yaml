# Market Profile API 契约
# 版本: 0.1.0-beta
# 状态: beta（接口可能变更）

# 对外暴露的API
public:
  # 主入口
  MarketRulesProxy:
    description: 市场规则代理，对外暴露的统一入口
    methods:
      # 构造函数
      __init__:
        parameters:
          default_market:
            type: str
            default: "china_a_stock"
            description: 默认挂载的市场ID
        returns: void
    
    # 实例方法
    instance_methods:
      # 挂载市场
      mount:
        parameters:
          profile_id:
            type: str
            description: 市场配置ID（如 'china_a_stock', 'hong_kong'）
        returns: void
        raises:
          - ValueError: 市场不存在
        since: 0.1.0-beta
      
      # 获取当前市场
      current:
        type: property
        returns: MarketBaseRules
        description: 当前挂载的市场规则实例
        raises:
          - RuntimeError: 没有市场挂载
        since: 0.1.0-beta
      
      # 获取特定市场
      get_market:
        parameters:
          profile_id:
            type: str
            description: 市场配置ID
        returns: MarketBaseRules
        description: 获取特定市场的规则实例
        raises:
          - ValueError: 市场不存在
        since: 0.1.0-beta
      
      # 列出所有可用市场
      list_available:
        returns: List[str]
        description: 列出所有可用的市场配置ID
        since: 0.1.0-beta
      
      # 判断市场是否可用
      is_available:
        parameters:
          profile_id:
            type: str
            description: 市场配置ID
        returns: bool
        since: 0.1.0-beta
      
      # 获取挂载的市场ID
      get_mounted_id:
        returns: str
        raises:
          - RuntimeError: 没有市场挂载
        since: 0.1.0-beta

  # 市场规则基类
  MarketBaseRules:
    description: 市场规则基类，所有具体市场规则的基类
    
    # 属性
    properties:
      profile_id:
        type: str
        description: 市场配置ID
        since: 0.1.0-beta
      
      name:
        type: str
        description: 市场名称
        since: 0.1.0-beta
      
      description:
        type: str
        description: 市场描述
        since: 0.1.0-beta
    
    # 实例方法
    instance_methods:
      # ==================== 涨跌幅限制 ====================
      
      get_limit_ratio:
        returns: float
        description: 获取默认涨跌幅限制比例
        since: 0.1.0-beta
      
      get_limit_ratio_for_stock:
        parameters:
          stock_id:
            type: str
            description: 股票ID（如 '688001.SH'）
          status_tags:
            type: Optional[Sequence[str]]
            default: None
            description: 状态标签（如 ['st', 'star_st']）
        returns: float
        description: 获取特定股票的涨跌幅限制比例
        since: 0.1.0-beta
      
      compute_limit_prices:
        parameters:
          prev_close:
            type: float
            description: 前收盘价
        returns: Tuple[float, float]
        description: 计算涨跌停价格（使用默认规则）
        since: 0.1.0-beta
      
      compute_limit_prices_for_stock:
        parameters:
          prev_close:
            type: float
            description: 前收盘价
          stock_id:
            type: str
            description: 股票ID
          status_tags:
            type: Optional[Sequence[str]]
            default: None
            description: 状态标签
        returns: Tuple[float, float]
        description: 为特定股票计算涨跌停价格
        since: 0.1.0-beta
      
      is_within_price_limit:
        parameters:
          current_price:
            type: float
            description: 当前价格
          prev_close:
            type: float
            description: 前收盘价
        returns: bool
        description: 判断价格是否在涨跌幅范围内（使用默认规则）
        since: 0.1.0-beta
      
      is_within_price_limit_for_stock:
        parameters:
          current_price:
            type: float
            description: 当前价格
          prev_close:
            type: float
            description: 前收盘价
          stock_id:
            type: str
            description: 股票ID
          status_tags:
            type: Optional[Sequence[str]]
            default: None
            description: 状态标签
        returns: bool
        description: 判断特定股票的价格是否在涨跌幅范围内
        since: 0.1.0-beta

      is_at_limit_up:
        parameters:
          price:
            type: float
            description: 拟成交价
          prev_close:
            type: float
            description: 前收盘价
          stock_id:
            type: str
            description: 股票ID
          status_tags:
            type: Optional[Sequence[str]]
            default: None
            description: 状态标签（如 ['st']）
        returns: bool
        description: 成交价是否视为涨停（贴涨停）；无涨跌幅/无效输入返回 False
        since: 0.1.0-beta

      is_at_limit_down:
        parameters:
          price:
            type: float
            description: 拟成交价
          prev_close:
            type: float
            description: 前收盘价
          stock_id:
            type: str
            description: 股票ID
          status_tags:
            type: Optional[Sequence[str]]
            default: None
            description: 状态标签（如 ['st']）
        returns: bool
        description: 成交价是否视为跌停（贴跌停）；无涨跌幅/无效输入返回 False
        since: 0.1.0-beta
      
      # ==================== 整手规则 ====================
      
      get_min_lot:
        returns: int
        description: 获取默认最小买入单位
        since: 0.1.0-beta
      
      get_lot_step:
        returns: int
        description: 获取默认每手步长
        since: 0.1.0-beta
      
      is_valid_quantity:
        parameters:
          quantity:
            type: int
            description: 买入数量（股数）
        returns: bool
        description: 判断数量是否符合整手规则（使用默认规则）
        since: 0.1.0-beta
      
      is_valid_quantity_for_stock:
        parameters:
          quantity:
            type: int
            description: 买入数量（股数）
          stock_id:
            type: str
            description: 股票ID
        returns: bool
        description: 判断特定股票的数量是否符合整手规则
        since: 0.1.0-beta
      
      floor_quantity:
        parameters:
          target_quantity:
            type: int
            description: 目标买入数量
        returns: int
        description: 计算符合整手规则的最大买入数量（使用默认规则）
        since: 0.1.0-beta
      
      floor_quantity_for_stock:
        parameters:
          target_quantity:
            type: int
            description: 目标买入数量
          stock_id:
            type: str
            description: 股票ID
        returns: int
        description: 计算特定股票符合整手规则的最大买入数量
        since: 0.1.0-beta
      
      # ==================== 交收规则 ====================
      
      get_settlement_period:
        returns: int
        description: 获取交收周期（T+N）
        since: 0.1.0-beta
      
      is_allowed_to_sell:
        parameters:
          days_held:
            type: int
            description: 持有天数（从买入日起）
        returns: bool
        description: 判断是否允许卖出（交收规则）
        since: 0.1.0-beta
      
      # ==================== 元数据 ====================
      
      get_name:
        returns: str
        description: 获取市场名称
        since: 0.1.0-beta
      
      get_description:
        returns: str
        description: 获取市场描述
        since: 0.1.0-beta
      
      get_profile_id:
        returns: str
        description: 获取市场配置ID
        since: 0.1.0-beta

# 支持的市场
markets:
  china_a_stock:
    name: 中国A股市场
    status: beta
    features:
      - T+1交收
      - 涨跌幅限制（主板10%，科创板/创业板20%，北交所30%）
      - ST等风险标签处理
      - 股票代码匹配规则
  
  hong_kong:
    name: 港股市场
    status: beta
    features:
      - T+0交收
      - 无涨跌幅限制
      - 100股起
  
  us_stock:
    name: 美股市场
    status: beta
    features:
      - T+0交收
      - 无涨跌幅限制
      - 1股起
  
  commodity_future:
    name: 商品期货市场
    status: beta
    features:
      - T+0交收
      - 涨跌幅按品种不同（能源8%，金属6%，农产品4%）
      - 1手起
  
  forex:
    name: 外汇市场
    status: beta
    features:
      - T+0交收
      - 无涨跌幅限制
      - 标准手（100,000）
  
  crypto:
    name: 数字货币市场
    status: beta
    features:
      - T+0交收
      - 无涨跌幅限制
      - 24小时交易
      - 极小单位

# 版本历史
versions:
  0.1.0-beta:
    date: 2026-07-10
    changes:
      - 初始版本
      - 所有API状态为beta
      - 支持6个市场（A股、港股、美股、期货、外汇、数字货币）

# 稳定性承诺
stability:
  status: beta
  description: |
    API处于beta阶段，可能在后续版本中变更。
    建议在稳定版本发布前，锁定具体版本号。
  
  breaking_changes_policy: |
    beta阶段可能引入breaking changes，但会：
    1. 在changelog中明确标注
    2. 提供迁移指南
    3. 尽量提前通知

# 废弃政策
deprecation_policy:
  beta_phase: |
    beta阶段的API可能随时变更，不保证向后兼容。
    稳定版本发布后，废弃的API将：
    1. 标记为deprecated
    2. 保留至少2个主版本
    3. 提供迁移路径