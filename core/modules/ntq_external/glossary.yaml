# NtqExternal 术语表
# Version: 0.1.1
# Compatible-Core: >=0.6.0
#
# 只固定「不要混用」的名字；地址与字段以 API.md 为准。

terms:
  NtqExternal:
    definition: "NTQ 与官网之间的客户端模块：地址、会员资料与 AI 通道、反馈、trace 发送端。"
    aliases:
      - "官网客户端"
      - "ntq_external"
    avoid:
      - "支付模块"
      - "账号系统"

  site_urls:
    definition: "给其他模块的官网页面地址集合（免责声明、许可、联系、注册、文档）。"
    aliases:
      - "官网地址"
    avoid:
      - "base_url（那是官网根地址，不是页面地址集合）"

  base_url:
    definition: "官网根地址。全应用只认 conf/site_target.py 一处，无末尾斜杠。"
    aliases:
      - "官网根地址"
    avoid:
      - "硬编码 https://new-tea.cn"

  member_profile:
    definition: "用本地通用凭证向官网查询的会员资料；响应不含凭证。"
    aliases:
      - "会员资料"
      - "用户资料"
    avoid:
      - "本地账号缓存（本模块不落盘资料）"

  catfood:
    definition: "官网会员通道的用量单位；余额不足时会员 AI 不可用。"
    aliases:
      - "猫粮"
      - "额度"
    avoid:
      - "points（点数是会员积分，不是猫粮）"

  Feedback:
    definition: "应用内软反馈门面；提交不要求 trace 同意，只可关闭提示。"
    aliases:
      - "反馈"
    avoid:
      - "Trace.consent（反馈不走同意开关）"

  trace_endpoint:
    definition: "infra.trace 的发送端地址；本模块导入时登记，安装事件不受统计开关影响。"
    aliases:
      - "trace 发送端"
    avoid:
      - "反馈接口（两者是不同端点）"
