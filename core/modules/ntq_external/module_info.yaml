name: modules.ntq_external
version: "0.2.1"
compatible_core_versions: ">=0.6.0"
package: core.modules
description: "NTQ 官网客户端：会员 AI、反馈，以及 trace 的官网发送端。"
# 站点文档（可选；Drupal title / display title）
site_title: "官网服务模块 (NTQ External)"
site_display_title: "与官网交互的服务 - NTQ External 模块"
dependencies:
  - infra.project_context
  - infra.membership
  - infra.trace
  - infra.ai
changelog:
  - version: "0.2.1"
    changes:
      - 新增 ntq_external.py 包根 Facade；文档版本与 module_info 对齐
      - 去掉 fetch_member_quota 旧版 limit/remaining 形状与 install_member 两参进度回调兼容
      - ai 包导出 fetch_member_usage
  - version: "0.2.0"
    changes:
      - member_channel.complete：官网会员补全（经 AiChannel.complete_http）
      - 承接原 infra.ai 内的会员路由，消除 infra→modules 反向依赖
  - version: "0.1.1"
    changes:
      - 公开演示安装包下载（install_demo）：URL + 拉取/校验，供 Setup 导入使用
  - version: "0.1.0"
    changes:
      - 会员 AI 通道、反馈、trace 官网地址收进本模块
      - conf 是对外地址的唯一来源，经 site_urls() 给其他模块
      - 导入时向 infra.trace 登记发送端；安装事件不看使用统计开关
