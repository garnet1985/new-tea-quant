# Strategy unit test case registry.
# Each case maps to one test file; scenarios align with test function names.
#
# STATUS: execution disabled during refactor (root conftest.py).
#         Re-run: NTQ_TESTS_ENABLED=1 pytest core/modules/strategy/__test__/
# Pending architecture cases: see /TESTING.md

cases:
  - id: 1
    case: api
    description: Enumerator 对外的公用函数接口
    file: test_enumerator_api.py
    scenarios:
      - case: 1
        name: run
        description: run 函数入参正确，ignore_cache 默认值为 False，runtime_settings 默认值为 None

      - case: 2
        name: run
        description: run 函数可根据 ignore_cache 触发和忽略缓存命中，强制刷新会产生新的缓存在db里

      - case: 3
        name: run
        description: run 函数可根据 runtime_settings 触发和忽略缓存命中，runtime_settings 为空时，会使用策略的默认配置

  - id: 2
    case: pipeline
    description: EnumeratorPipeline 统一编排（按 execution_mode 接 JobBuilder/Executor）
    file: test_enumerator_pipeline.py
    scenarios:
      - case: 1
        name: run
        description: run 入参正确；entity_based / slice_based 走同一编排骨架

      - case: 2
        name: run_entity_mode
        description: execution_mode=entity_based 时选用 entity JobBuilder/Executor

      - case: 3
        name: run_slice_mode
        description: execution_mode=slice_based 时选用 slice JobBuilder/Executor

  - id: 3
    case: report_manager
    description: ReportManager 类
    file: test_report_manager.py
    scenarios:
      - case: 1
        name: run
        description: run 函数入参正确，ignore_cache 默认值为 False，runtime_settings 默认值为 None

---
