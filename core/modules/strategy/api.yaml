module: modules.strategy
version: 0.6.0
requires: core>=0.5.0

# ---------------------------------------------------------------------------
# 用语
#
#   Strategy        — Facade，对外唯一入口
#   namespace       — scan / enumerate / analyze / discovery
#   strategy_name   — 策略名称
#   SimulateKind    — enumerate / price_factor / capital_allocation / full（Strategy.simulate）
#
# ---------------------------------------------------------------------------

---

Strategy:
  layer: facade
  description: "策略模块 Facade — scan / enumerate / price_factor / portfolio / simulate / discovery"


  apis:
    scan:
      description: "执行机会扫描"
      stability: beta
      binding: static
      parameters:
        keyword:
          - name: strategy_name
            type: Optional[str]
            required: false
            default: null
            notes: "策略名称，未指定时扫描所有启用策略"
        keyword_only:
          - name: demo
            type: bool
            required: false
            default: false
            notes: "demo模式，放宽K线与日历对齐校验"
      returns: Dict[str, Any]
      notes: |
        - 未指定strategy_name时扫描所有启用策略
        - demo=True用于测试环境，不强制数据对齐
        - 返回每个策略的扫描结果字典
      example: |
        # 扫描单个策略
        result = Strategy.scan("demo_strategy")
        
        # 扫描所有启用策略
        results = Strategy.scan()
        
        # demo模式扫描
        result = Strategy.scan("demo_strategy", demo=True)

    enumerate:
      description: "运行 entity_based 枚举器"
      stability: beta
      binding: static
      parameters:
        positional:
          - name: strategy_name
            type: str
            required: true
            notes: "策略名称（例如 demo/random/random_v1_null_baseline）"
        keyword_only:
          - name: userspace_root
            type: Optional[str]
            required: false
            default: null
            notes: "userspace 根路径，默认 userspace"
          - name: strategies_root
            type: Optional[str]
            required: false
            default: null
            notes: "策略扫描根目录，默认 userspace/strategies；devtools 测试可指向 test_base_strategies"
      returns: Dict[str, Any]
      notes: |
        - 编排层先算指纹并查 EnumCacheManager；miss 后进入 EnumeratorPipeline（带 settings_fp/env_fp）
        - 等价于 Strategy.simulate(kind=enumerate)
      example: |
        result = Strategy.enumerate("demo/random/random_v1_null_baseline")
        print(result["total_opportunities"])

    analyze:
      description: "分析模拟结果"
      stability: beta
      binding: static
      parameters:
        keyword_only:
          - name: session_id
            type: Optional[str]
            required: false
            default: null
            notes: "session ID（预留，当前未使用）"
      returns: None
      notes: |
        - 读取各启用策略的模拟结果摘要
        - 打印price_factor和capital_allocation的版本信息
        - session_id预留参数，当前未实现
      example: |
        Strategy.analyze()

    list_strategies:
      description: "发现所有策略名称"
      stability: stable
      binding: static
      parameters:
        keyword_only:
          - name: strategies_root
            type: Optional[str]
            required: false
            default: null
            notes: "策略扫描根目录，默认 userspace/strategies"
      returns: List[str]
      notes: "返回所有已发现的策略名称列表"
      example: |
        strategies = Strategy.list_strategies()
        # ["demo_strategy", "test_strategy"]

    get_strategy_info:
      description: "获取策略详细信息"
      stability: stable
      binding: static
      parameters:
        positional:
          - name: strategy_name
            type: str
            required: true
        keyword_only:
          - name: strategies_root
            type: Optional[str]
            required: false
            default: null
            notes: "策略扫描根目录，默认 userspace/strategies"
      returns: Optional[Dict[str, Any]]
      notes: |
        - 返回策略元数据字典
        - 包含is_enabled、settings等信息
        - 策略不存在时返回None
      example: |
        info = Strategy.get_strategy_info("demo_strategy")
        # {"name": "demo_strategy", "is_enabled": true, ...}

---

SimulateKind:
  layer: contracts
  description: "模拟类型枚举"
  values:
    - ENUMERATE: 枚举机会
    - PRICE_FACTOR: 价格因子模拟
    - CAPITAL_ALLOCATION: 资金分配模拟
    - FULL: 完整流程

ExecutionMode:
  layer: contracts
  description: "执行模式枚举"
  values:
    - SCAN: 扫描模式
    - SIMULATE: 模拟模式

SellReason:
  layer: contracts
  description: "卖出原因枚举"
  values:
    - STOP_LOSS: 止损卖出
    - TAKE_PROFIT: 止盈卖出
    - MAX_HOLDING: 最大持有期卖出
    - END_OF_PERIOD: 期末卖出

---