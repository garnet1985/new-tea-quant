name: modules.strategy
version: 0.7.0
compatible_core_versions: ">=0.4.4"
description: "策略执行模块：Strategy facade 提供 scan / simulate / analyze / discovery namespace API。"
dependencies:
  - modules.data_manager
  - modules.data_contract
  - modules.indicator
  - modules.backtest_engine
  - modules.adapter
  - modules.market_profile
  - modules.data_source
  - infra.project_context
  - infra.discovery
  - infra.export_import
  - infra.cmd_layout
  - infra.utils
changelog:
  - version: "0.7.0"
    changes:
      - 对齐 CORE_MODULE_STANDARDS：包根仅 Strategy；枚举迁入 contracts.py
      - 根 API.md / QUICKSTART / TEST_CASES；docs/ARCHITECTURE + DESIGN；删除 api.yaml
      - "标准化 P0（不 bump）：删遗留 test_cases*.yaml；BOUNDARY→docs/notes/；API 全 beta 并补签名；glossary 合规；README 对齐；落地 test_api；修复 list_*/get_strategy_info 与 DiscoveryService 脱节"
      - "标准化 P1（不 bump）：Facade 下沉 core/strategy.py；ARCHITECTURE 补齐；根 UT 下沉 engines/services；TEST_CASES 仅公开面"
      - "标准化 P2 低风险（不 bump）：AnalyzeService；get_cache 带回 workbench version；PackageCli 收口 CLI 自由函数"
      - "穿透小步（不 bump）：Strategy 发现/包/清缓存公开面（find/list_strategy_infos/resolve/is_valid_path/clear_workbench_cache/export_package/import_package）；infra CLI + system_actions 改走 Facade"
      - "tag 依赖面（不 bump）：contracts 导出 AsOfSlice/JobBundleLoader/ProgressRecorder；Facade 增加 latest_completed_trading_date"
      - "依赖穿透治理（不 bump）：module_info 补全 adapter/market_profile/data_source 与 infra.discovery/export_import/cmd_layout/utils"
      - "依赖穿透治理（不 bump）：BE/MarketProfile/DataContract 改调用；Adapter.load_class、DS freshness、DM normalize_delist_date、BE profiler contracts"
  - version: "0.6.0"
    changes:
      - 重构：Facade + namespace API设计，符合CORE_MODULE_STANDARDS.md
      - 创建strategy.py作为Facade，使用namespace API（scan/simulate/analyze/discovery）
      - 创建api.yaml定义公开API契约
      - 创建contracts.py定义公开类型（ExecutionMode/SellReason/SimulateKind）
      - 工作台 / CLI / package / progress 在本模块 services；UI snapshot/hydrate 在 BFF helpers
      - 简化__init__.py导出，只导出Strategy和contracts类型
  - version: "0.5.1"
    changes:
      - 对 AggregateProfiler 运行时注入元数据
      - 重新定义了策略的指纹缓存系统，现在db里的指纹是由diff生成而不是snapshot，同时bff给UI的设置变成了物理硬盘的设置+缓存diff的方式
  - version: "0.5.0"
    changes:
      - 支持多股并行的切片式回测
      - 枚举器目录重组：shared / stock_based / calendar_sliced 双 flow + router
  - version: "0.4.1"
    changes:
      - 模拟产物 latest 按数字 id 解析（enum/price/capital），修复字典序导致引用旧枚举目录、env_fp 与 DbCache 错位
      - price/capital 写 DbCache 时从磁盘补全缺失 enum 槽（与 CLI/UI 同一 execution_manager，无读侧兼容）
  - version: "0.4.0"
    changes:
      - 策略交流包 services/package：依赖解析、export/preview/import（基于 infra.export_import）
      - 枚举/价格 performance 与 dispatch 参数迁出策略 settings，改由 worker.json profile
      - settings 指纹剔除调度键；price entities_per_job 默认改由 profile 提供
      - 回测/标签数据加载走 data_contract，去除硬编码数据源
      - 价格因子 bulk dispatch（entities_per_job）与 JobPipeline profile 集成
  - version: "0.3.3"
    changes:
      - 交易日历与风险时段集成；资金回测交易量限制
      - 枚举 metadata.stock_status_at_trigger；dev-cli py39 检查
  - version: "0.3.2"
    changes:
      - simulation 模板与 market_profile 集成；工作台进度与版本指纹改进
  - version: "0.3.0"
    changes:
      - 策略工作台与 UI 联动；settings 校验与指纹体系基线
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能