name: modules.strategy
version: "0.9.0"
compatible_core_versions: ">=0.5.0"
description: "策略执行模块：Strategy facade 提供 scan / simulate / discovery namespace API。"
dependencies:
  - modules.data_manager
  - modules.data_contract
  - modules.indicator
  - modules.backtest_engine
  - modules.adapter
  - modules.market_profile
  - modules.data_source
  - infra.project_context
  - infra.discovery
  - infra.export_import
  - infra.cmd_layout
  - infra.utils
  - infra.trace
changelog:
  - version: "0.9.0"
    changes:
      - 将枚举结果变成契约，后续价格，组合，决策者模式都可以共用
      - （破坏性改动，需要更高版本内核）将枚举结果从3个csv文件简化成一个json文件，并且不在支持csv
      - 在资金回测层加入夏普 / Sortino 比率，无风险取隔夜 SHIBOR
      - 决策者模式第一刀：会话引擎 + CLI `sd`/`sdl`/`sdd` + 走完后与 portfolio 同结构 finalize
      - 决策者 as-of 胜率按该标的 D 之前已完成枚举；建议买入跟 allocation.mode（等价 / 等股 / 凯莉）
      - 枚举出场受流动性限制时跨周期继续卖，持仓归零才记一笔交易 / 胜率 / ROI；资金层按 completed_goals 切片兑现
      - 决策者账户盈亏相对起始资金；纪律卖出股数问 market profile 申报规则
      - 决策者时钟在仓位变化（成交的目标卖出）和新机会两类事件日都暂停
      - 决策者持仓时长按到期模式计交易日，不再拿自然日去比「30 个交易日」
      - 决策者 UI 填股数，按市场手数步进并显示等额价格；持仓目标不再展示复权价
      - 单策略决策模拟作为制定策略第四步（交互对局，不进入 WorkbenchStep / simulate）
      - 决策模拟建议买入按仓位预算÷买价折手，不掺佣金，科创板不再显示为 —
      - 决策模拟事件回溯提供截止当天的发现机会数与买卖成交（股数 / 花费）
      - 回测 ROI 收口到 HfqRoi：枚举 / 价格层 / 资金盯市 / 决策者持仓同一套 100→120，手续费不进分母
      - 决策者出场标明具体止盈档；剩余持仓把已卖掉的档标为已完成
  - version: "0.8.0"
    changes:
      - 重构策略模块的归因分析，渐入cmd和UI的入口，增加设置里对归因分析的开关
      - 移除 Strategy.analyze 独立入口，入口变成内部通过settings的连接
      - 重新设计回测缓存系统，淘汰数据库缓存，UI和命令行都直接反馈入settings.py
      - 重新指定了指纹生成逻辑：新概念execute_fp包含原来的settings_fp和env_fp里的回测范围字段，settings_fp不再使用。
  - version: "0.7.0"
    changes:
      - 移除 Strategy.analyze 与 AnalyzeService
      - 用户扫描钩子改为 has_opportunity(ctx) -> bool；enumerate 与 scan 共用；命中后由框架构建 Opportunity
      - extra_fields 更名为 signal_snapshot
      - StrategyContext 提供 remember/recall/forget（custom）与 capture（命中后写入 signal_snapshot）
  - version: "0.6.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 修改了暴露的API参数，函数，防止外部模块直接调用包内非公开接口
      - 正式版本之前所有API标注beta状态
      - 提供更多API防止外部模块直接调用包内非公开接口
  - version: "0.5.3"
    changes:
      - 正式更名capital allocation回测步骤为portfolio，投资组合的名称更加语义化
      - 为portfolio提供了选择机会投资的钩子函数，不再是先到先得机制
      - 对投资组合依赖的模拟结果记录了股票的裸价格而不再光是复权价格，这样机会的真实投资价格变成了实际股票的价格，提高了回测准确性。
      - 修改并实现了“复权价仅产生信号，裸价格进行实际交易”的双轨机制
  - version: "0.5.2"
    changes:
      - 对切片模式进行优化，进行读算分离，并且由回测引擎（backtest engine）自动计划实施。
      - 彻底淘汰老的回测引擎，不再使用预处理，执行和后期处理三个步骤。
      - 用户所有的钩子函数不再挂载在子进程里，而是用一个全局Hook基类进行声明和注入，这样用户也可以参与主进程内的回测干预。
  - version: "0.5.1"
    changes:
      - 对策略和回测引擎加入profiler功能，方便调试性能瓶颈
      - 重新定义了策略的指纹缓存系统，现在db里的指纹是由diff生成而不是snapshot，同时bff给UI的设置变成了物理硬盘的设置+缓存diff的方式
  - version: "0.5.0"
    changes:
      - 支持多股并行的切片式回测
      - 对entity based和slice based两种回测模式进行代码重组，提取公用
      - 废弃job pipeline，重新将job build职责还给strategy
      - 抽象backtest engine，让回测推进与任务规划分开，这样标签（tag）模块可以复用回测引擎以及切片模式。
  - version: "0.4.1"
    changes:
      - 重定义标准模拟产物格式（enum/price/capital）
      - 修复UI和对应的模拟中间值的映射错误
  - version: "0.4.0"
    changes:
      - 引入数据契约，真正实现可配置动态数据源
      - JobPipeline加强，让每个进程并行执行多个股票回测，减小数据库请求次数，大大增加了回测速度
  - version: "0.3.4"
    changes:
      - 支持策略导入导出
      - 性能配置移出用户配置，支持auto的性能配置，使用探针完成自动最优（不一定最优但安全）配置
      - 将股票任务调度抽象成独立模块JobPipeline
  - version: "0.3.3"
    changes:
      - 股票推进不再按照有记录的日期推进，而是按照真实的交易日历推进，使目标中的过期时间更加准确
      - 引入股票风险时段数据，为将来风险规避设置提供数据依据
      - 引入资金回测交易量限制，因为太多交易量会直接导致市场流动性不足，从而让模拟失真。
  - version: "0.3.2"
    changes:
      - simulation 模板与 market_profile 集成；
      - 工作台进度与版本指纹改进
  - version: "0.3.1"
    changes:
      - 重构BFF，让core不再反向依赖BFF
  - version: "0.3.0"
    changes:
      - 支持UI，提供了UI launcher提供BFF所需要的功能
      - 引入指纹概念，对设计变化产生的结果进行数据库缓存
  - version: "0.2.2"
    changes:
      - 收紧枚举范围，不再全量枚举所有股票而是按需枚举
  - version: "0.2.1"
    changes:
      - 引入价格回测概念，支持了真实资金投资模拟
  - version: "0.2.0"
    changes:
      - 重构了核心模拟器的代码，将整个声明周期分成了预处理，执行和后期处理三个部分
      - 对回测进行了业务分层，使用全局枚举对后期回测进行数据缓存和复用
  - version: "0.1.1"
    changes:
      - 加入目标配置，支持动态止损和保护性止盈
      - 引入股票抽样机制
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
      - 提供了可以按照K线数据进行回测的功能，提供了用户需要自定义策略的接口
      - 提供了声明式回测设置，让回测大部分步骤可以配置
      - 提供多进程回测，每个进程处理一只股票
