# Strategy 模块 dispatch 配置（性能基准调优，用户不可覆盖）
enumerator:
  reserve_cores: 2
  max_parallel_jobs_cap: null
  dispatch:
    memory_budget_mb: auto
    memory_floor_mb: auto
    entities_per_job: auto
    dispatch_probe: true
    entities_per_job_min: 1
    entities_per_job_max: 500
    worker_memory_fraction: 0.85
    prefetch_ahead: 1
  calendar_slice:
    reader_workers: auto
    queue_depth: auto
    prefetch_enabled: true

price_factor:
  reserve_cores: 1
  max_parallel_jobs_cap: null
  dispatch:
    entities_per_job: 1000
    dispatch_probe: false
    force_main_process: false

scanner:
  reserve_cores: 1
  max_parallel_jobs_cap: null
  dispatch:
    entities_per_job: 1
    dispatch_probe: false
