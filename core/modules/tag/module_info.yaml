name: modules.tag
version: 0.3.1
compatible_core_versions: ">=0.4.0"
description: "标签资产层：按场景（Scenario）发现配置、多进程执行 TagWorker，基于 DataContract + DataCursor 按 as_of 切片计算并批量落库。"
dependencies:
  - modules.data_manager
  - modules.data_contract
  - modules.data_cursor
  - infra.project_context
  - infra.worker
  - infra.job_pipeline
changelog:
  - version: "0.3.1"
    changes:
      - 增强tag的profiler，帮助性能测试收集必要的数据
      - 新增 dry-run 模式：运行计算但不写入数据库
  - version: "0.3.0"
    changes:
      - 支持sliced块状切片
      - engines 目录重组：shared / timeline / sliced + router
      - TagManager 精简为发现与调度入口
      - Tag calendar_slice 一等 API on_calendar_asof + carry + entity_tags fan-out
      - Tag 控制台 launcher + BFF（T1-00…03）；全局 pipeline 租约
  - version: "0.2.1"
    changes:
      - Tag 调度并行度改读 job_pipeline profile（tag profile）
      - dispatch 调优文档与 JobPipeline worker_profile 对齐
  - version: "0.2.0"
    changes:
      - Scenario 发现、TagWorker 多进程、DataContract + DataCursor as_of 切片落库
