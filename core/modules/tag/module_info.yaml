name: modules.tag
version: "0.4.3"
compatible_core_versions: ">=0.5.0"
package: core.modules
description: "标签资产层：按 data.base 路由；per_entity 经 BacktestEngine；global / non_time_series 主进程推进器。execute 同步；异步壳在 BFF/agent。"
# 站点文档（可选；Drupal title / display title）
site_title: "标签模块 (Tag)"
site_display_title: "给任何对象打个标签 - Tag 模块"
dependencies:
  - modules.data_manager
  - modules.data_contract
  - modules.data_source
  - modules.backtest_engine
  - modules.strategy
  - modules.indicator
  - infra.project_context
  - infra.discovery
  - infra.utils
  - infra.trace
  - infra.progress
changelog:
  - version: "0.4.3"
    changes:
      - "module_info 补全 data_source / indicator 依赖；可视化日期归一化改 Utils.date；移除包内 TagDataService.rebind 单测（归属 data_manager）"
  - version: "0.4.2"
    changes:
      - "Facade 增加 list_tag_infos / get_tag_info / resolve_* / load_hooks_class 与进度 IO；异步编排在 BFF/agent"
  - version: "0.4.1"
    changes:
      - "TagRunProgress 直连 Progress.channel（channel=tag-run），不再经 strategy.ProgressRecorder"
  - version: "0.4.0"
    changes:
      - 标准化模块，标准化文档以及对外API
      - 修改了暴露的API参数，函数，防止外部模块直接调用包内非公开接口
      - 正式版本之前所有API标注beta状态
      - 提供更多API防止外部模块直接调用包内非公开接口
  - version: "0.3.2"
    changes:
      - 更好地支持非时序数据的标签计算（不走回测引擎）
  - version: "0.3.1"
    changes:
      - 引入新的数据契约，使用契约内的数据游标，让贴标签速度提高6-9倍
  - version: "0.3.0"
    changes:
      - 迁移到backtest engine，淘汰老的标签模块
      - 支持切片运行（因为回测引擎支持了）
      - 支持dry-run模式，只计算不入库
      - 加入profiler收集运行的性能数据
      - 移除 JobPipeline，不再需要单独的job调度器
  - version: "0.2.1"
    changes:
      - 支持交易日历推进
      - 支持UI显示，增加了BFF launcher
  - version: "0.2.0"
    changes:
      - Tag 调度集成 job_pipeline
      - 优化文档
  - version: "0.1.0"
    changes:
      - 初始化模块，完成基础功能
      - 场景（Scenario） 发现
      - 多进程计算
      - 支持增量式标签计算
