name: modules.tag
version: 0.4.0
compatible_core_versions: ">=0.4.4"
description: "标签资产层：Tag facade 提供 discovery / execute；entity_based / slice_based 经 BacktestEngine 计算并落库；BFF 经 core.bff_support。"
dependencies:
  - modules.data_manager
  - modules.data_contract
  - modules.backtest_engine
  - infra.project_context
changelog:
  - version: "0.4.0"
    changes:
      - 标准模块根契约：tag.py Facade、api.yaml、contracts.py、glossary.yaml
      - launcher 迁入 core/bff_support（TagCatalog / TagRunLauncher）
      - incremental 水位改为 last_calculated_end（非 max(as_of)）
      - 删除旧 engines/timeline/sliced/BaseTagWorker 路径
  - version: "0.3.2"
    changes:
      - Tag timeline / calendar_slice 执行迁移至 BacktestEngine
      - calendar_slice 主进程按 slice 阶段性 save_batch 落库
      - 移除 JobPipeline 执行路径；调度配置改读 BacktestEngine TimelineConfig / SliceConfig
  - version: "0.3.1"
    changes:
      - 增强tag的profiler，帮助性能测试收集必要的数据
      - 新增 dry-run 模式：运行计算但不写入数据库
      - 加入data cursor计算到calendar_slice模式中，让回测速度提高6-9倍
  - version: "0.3.0"
    changes:
      - 支持sliced块状切片
      - engines 目录重组：shared / timeline / sliced + router
      - TagManager 精简为发现与调度入口
      - Tag calendar_slice 一等 API on_calendar_asof + session_state + entity_tags fan-out
      - Tag 控制台 launcher + BFF（T1-00…03）；全局 pipeline 租约
  - version: "0.2.1"
    changes:
      - Tag 调度并行度改读 job_pipeline profile（tag profile）
      - dispatch 调优文档与 JobPipeline worker_profile 对齐
  - version: "0.2.0"
    changes:
      - Scenario 发现、TagWorker 多进程、DataContract + DataCursor as_of 切片落库
