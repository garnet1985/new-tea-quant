name: tables
version: 0.4.2
compatible_core_versions: ">=0.5.0"
description: "数据表定义：统一 schema.py 发现与注册，按领域（stock/industry/macro/calendar/index/tag/system）组织。"
dependencies: []
changelog:
  - version: "0.4.2"
    changes:
      - 行业改为申万 2021，表定义放在 core/tables/industry（sw_meta / sw_stock_map / sw_kline）
      - 移除 sys_industries、sys_stock_industry_map（stock_basic 扁平行业）
  - version: "0.4.1"
    changes:
      - 补齐 module_info 元数据，与核心 0.4.1 对齐
  - version: "0.4.0"
    changes:
      - (破坏性) sys_data_stock_klines / sys_stock_index_klines：highest/lowest 重命名为 high/low
      - 新增加stock_moneyflow表
  - version: "0.3.0"
    changes:
      - (破坏性) sys_data_adj_factor_events：新增 qfq_anchor、raw_anchor；factor/qfq_diff 改 DECIMAL(12,x)；last_update 改 renew 门控
      - sys_data_adj_factor_events 新增索引 idx_id_last_update
  - version: "0.2.0"
    changes:
      - (破坏性) sys_data_stock_list：去掉 is_active；新增 list_status、list_date、delist_date、last_update 及 PIT 索引（L/D/P 全量 + 时点回测）
      - 新增第四维分类地域：sys_data_areas（定义表）+ sys_map_stock_area
      - sys_data_boards / sys_industries / sys_data_markets：is_alive 语义统一为「本批 stock_list 是否仍引用」
      - 新增 sys_data_stock_st_periods（ST 风险时段 tier/period，配合回测 ST 规则）
  - version: "0.1.0"
    changes:
      - (破坏性) sys_data_stock_list 移除 industry_id、market_id、board_id
      - 新增维度定义表 sys_industries、sys_data_boards、sys_data_markets
      - 新增映射表 sys_stock_industry_map、sys_map_stock_board、sys_map_stock_market
      - 新增 sys_data_trade_calendar（交易日历）"
