name: ui
version: "0.2.2"
compatible_core_versions: ">=0.5.0"
description: "NTQ 前端UI基础设施：提供可视化的用户界面，通过浏览器展示。"
dependencies:
  - modules.strategy
  - infra.project_context
changelog:
  - version: "0.2.2"
    changes:
      - 决策模拟页面支持嵌入式展示
      - 决策模拟投资格常显股数输入，约等于金额固定占右侧，避免按钮切换与重绘抖动
      - 确认当天选择改为「返回查看」，关闭账单不清空已选股数
      - 事件回溯月历改为 Outlook 式表格：格子上方发现机会，其下记录买入 / 卖出明细
      - 事件回溯日历弹窗在视口居中
      - 月历事件悬停显示完整买卖信息
      - 决策模拟持仓浮动盈亏%用后端 hfq ROI，不再用现价/买价混算
      - 决策模拟出场日志写明止盈档名；持仓芯片按已卖出的档标已完成
  - version: "0.2.1"
    changes:
      - 前端 React 17 → 18.3（createRoot）
      - 重新整理了版本变化逻辑，现在都是根据物理settings文件作为主体进行版本控制
      - 支持用户一边使用编辑器，一边使用UI更改配置，同时保证两者的一致性
      - 回测不同步骤里加入了归因的报告
  - version: "0.2.0"
    changes:
      - 重新设计一些策略工作台的API接口，优化用户体验
      - 增加Trace模块的询问，详情以及设置页面
  - version: "0.1.2"
    changes:
      - 新增加tag和data source页面，并入“高级功能”菜单下
  - version: "0.1.2"
    changes:
      - 安装向导与设置页支持 DuckDB（默认引擎）；
      - 修复 duckdb 被误显示为 postgresql 的问题
  - version: "0.1.1"
    changes:
      - 完成策略工作台、设置编辑与回测进度 UI
      - header 增加版本号
  - version: "0.1.0"
    changes:
      - 基础 Fed 构建链路与 launcher 集成
