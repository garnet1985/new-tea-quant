[pytest]
# pytest configuration for NTQ project
#
# REFACTOR FREEZE: all tests skipped by default (see /conftest.py).
# Cases remain in */__test__/test_cases.yaml. To run: NTQ_TESTS_ENABLED=1 pytest ...

# Test discovery paths
testpaths = core/infra

# Exclude UI tests (require flask dependency)
norecursedirs = core/ui

# Same basename (test_api.py) under many modules — avoid "import file mismatch"
addopts = -v --tb=short --strict-markers --import-mode=importlib

# Markers for test categorization
markers =
    ui: UI tests that require flask dependency (deselect with '-m "not ui"')
    core: Core module tests (select with '-m core')
    slow: Slow running tests (deselect with '-m "not slow"')
    force_run: run during refactor freeze (see root conftest.py)

# Minimum pytest version
minversion = 6.0

# Python files to treat as tests
python_files = test_*.py *_test.py

# Python classes to treat as tests
python_classes = Test*

# Python functions to treat as tests
python_functions = test_*